lito como estavam antes.", "oracao": "Que cada reparação me aproxime de uma vida onde palavras e ações caminham juntas.", "lembrete": "Reparação aproxima palavras e ações da mesma direção."}, {"titulo": "Honrar quem foi machucado, hoje", "reflexao": "Não posso desfazer o passado, mas posso agir hoje de um jeito que honre quem fui machucado. Cada escolha diária, mesmo pequena, é uma oportunidade de demonstrar esse respeito renovado.", "oracao": "Que minhas ações de hoje honrem quem foi machucado pelo meu passado.", "lembrete": "Honrar o outro acontece nas ações de hoje, não só nas palavras sobre ontem."}, {"titulo": "Palavras e ações contínuas", "reflexao": "Algumas reparações acontecem em palavras. Outras, em ações contínuas ao longo do tempo. Aprendo a reconhecer qual forma cada situação específica exige, sem tentar aplicar a mesma fórmula a tudo.", "oracao": "Que eu reconheça, em cada situação, se a reparação pede palavras, ações contínuas, ou ambas.", "lembrete": "Cada reparação pede sua própria forma — palavras, ações, ou as duas."}, {"titulo": "Cuidar da própria recuperação também", "reflexao": "Cada reparação sincera é também uma forma de cuidar da minha própria recuperação. O trabalho que faço em relação aos outros fortalece, ao mesmo tempo, minha própria estabilidade e minha própria paz.", "oracao": "Que o cuidado com os outros através da reparação também fortaleça minha própria recuperação.", "lembrete": "Cuidar do outro através da reparação também é cuidar de mim."}, {"titulo": "Desconforto que reconstrói confiança", "reflexao": "Estou disposto a reparar mesmo quando é desconfortável, porque é assim que reconstruo a confiança — não evitando o desconforto, mas atravessando-o com intenção e cuidado.", "oracao": "Que eu atravesse o desconforto necessário para reconstruir a confiança que foi abalada.", "lembrete": "A confiança se reconstrói atravessando o desconforto, não evitando-o."}, {"titulo": "Um dos atos mais concretos", "reflexao": "Reparar diretamente, sempre que possível, é um dos atos mais concretos da minha mudança. Não é apenas uma intenção abstrata — é uma ação real, com resultado tangível na vida de quem foi afetado.", "oracao": "Que minhas reparações continuem sendo atos concretos, não apenas intenções abstratas.", "lembrete": "Reparação concreta vale mais que intenção abstrata."}, {"titulo": "Investimento na confiança de amanhã", "reflexao": "Cada gesto de responsabilidade hoje é um investimento na confiança de amanhã. Penso nesse trabalho não como um evento isolado, mas como parte de um investimento contínuo em relações mais saudáveis no futuro.", "oracao": "Que cada gesto de responsabilidade hoje construa a confiança de que vou precisar amanhã.", "lembrete": "Responsabilidade hoje é investimento na confiança de amanhã."}, {"titulo": "Um capítulo novo", "reflexao": "Cada reparação bem-feita é um capítulo novo na relação que eu quase perdi. Não apaga os capítulos anteriores, mas mostra que a história ainda pode seguir em uma direção diferente.", "oracao": "Que cada reparação bem-feita abra um capítulo novo nas relações que quase perdi.", "lembrete": "A reparação abre um capítulo novo, sem apagar os anteriores."}, {"titulo": "Um processo, não um evento único", "reflexao": "Estou aprendendo que reparar é um processo, não um evento único. Uma conversa não resolve tudo de uma vez — é o começo de um caminho mais longo de reconstrução gradual.", "oracao": "Que eu tenha paciência com o processo contínuo de reparação, sem esperar que uma única conversa resolva tudo.", "lembrete": "Reparar é processo contínuo, não evento único."}, {"titulo": "Vale cada esforço", "reflexao": "A confiança que reconstruo, reparação após reparação, vale cada esforço que faço hoje. Mesmo nos dias em que o progresso parece lento, sei que cada esforço soma para o resultado final.", "oracao": "Que eu reconheça que cada esforço de reparação vale a pena, mesmo quando o progresso parece lento.", "lembrete": "Cada esforço de reparação vale a pena, mesmo o lento."}, {"titulo": "Um passo maior para a própria paz", "reflexao": "Cada passo sincero de reparação é também um passo maior para a minha própria paz. O trabalho que faço pelos outros, curiosamente, é também o que mais me devolve tranquilidade interior.", "oracao": "Que cada passo de reparação me traga, também, mais paz interior.", "lembrete": "Reparar o outro também traz paz para dentro de mim."}, {"titulo": "Fechando o mês: confiança em reconstrução", "reflexao": "Termino este mês vendo a confiança sendo reconstruída, aos poucos, com quem realmente importa para mim. Sigo para o próximo passo, onde essa honestidade se torna prática diária e contínua, não apenas um momento pontual de reparação.", "oracao": "Que eu leve, para o próximo mês, o compromisso de continuar honrando as reparações já feitas.", "lembrete": "A confiança reconstruída precisa ser sustentada, não só conquistada uma vez."}]}, {"month": "Outubro", "passo": "Passo 10", "tema": "Continuamos a fazer um inventário pessoal e quando estávamos errados, prontamente o admitimos", "days": [{"titulo": "A recuperação continua viva", "reflexao": "Continuar meu inventário diário é o que mantém minha recuperação viva e honesta. Não é um trabalho que termina depois dos primeiros passos — é uma prática que sustento todos os dias, mesmo quando já se passou muito tempo.", "oracao": "Que eu mantenha viva a prática diária de revisar honestamente meu comportamento.", "lembrete": "A recuperação se mantém viva na prática diária."}, {"titulo": "Admitir prontamente", "reflexao": "Quando erro, escolho admitir prontamente, em vez de deixar o orgulho crescer em silêncio. Quanto mais cedo reconheço um erro, menor o espaço que ele tem para se transformar em algo maior.", "oracao": "Que eu admita meus erros prontamente, antes que o orgulho tenha tempo de crescer em torno deles.", "lembrete": "Admitir prontamente evita que o erro cresça."}, {"titulo": "Nova oportunidade a cada dia", "reflexao": "Cada dia é uma nova oportunidade de me observar com honestidade e gentileza. Não carrego o peso de todos os dias anteriores — cada manhã começa com essa chance renovada de fazer melhor.", "oracao": "Que eu use cada novo dia como uma oportunidade renovada de observação honesta e gentil.", "lembrete": "Cada dia é uma nova chance de observação honesta."}, {"titulo": "Revisar em tempo real", "reflexao": "Não espero acumular erros para depois olhar para eles. Reviso meu dia enquanto ele acontece, o que me permite corrigir o rumo antes que pequenos deslizes se tornem padrões maiores.", "oracao": "Que eu revise meu comportamento em tempo real, sem esperar acumular problemas antes de agir.", "lembrete": "Revisar em tempo real evita que pequenos erros se acumulem."}, {"titulo": "Um erro pequeno evita um padrão maior", "reflexao": "Admitir um erro pequeno hoje evita que ele se torne um padrão amanhã. Esse cuidado constante, embora pareça excessivo às vezes, é o que sustenta a estabilidade da minha recuperação a longo prazo.", "oracao": "Que a atenção aos pequenos erros de hoje evite que eles se transformem em padrões futuros.", "lembrete": "Um erro pequeno admitido hoje evita um padrão amanhã."}, {"titulo": "Manutenção, não só grandes passos", "reflexao": "Minha recuperação não termina nos primeiros passos — se mantém viva na prática diária de manutenção. Os grandes momentos de virada foram importantes, mas é a manutenção constante que sustenta tudo.", "oracao": "Que eu valorize a manutenção diária tanto quanto valorizei os grandes momentos de virada.", "lembrete": "A manutenção diária sustenta os grandes passos já dados."}, {"titulo": "A pergunta da noite", "reflexao": "Cada noite, reservo um momento para perguntar: onde eu poderia ter agido melhor hoje? Essa pergunta simples, feita com regularidade, tem me ajudado a manter uma consciência mais afiada sobre meu próprio comportamento.", "oracao": "Que eu continue fazendo, todas as noites, essa pergunta simples e honesta sobre o meu dia.", "lembrete": "Uma pergunta simples à noite mantém a consciência afiada."}, {"titulo": "Sem dureza excessiva", "reflexao": "Não me julgo com dureza pelos erros — apenas os reconheço e sigo em frente. Aprendi que a dureza excessiva comigo mesmo não melhora meu comportamento; só me deixa mais propenso a desistir.", "oracao": "Que eu reconheça meus erros sem dureza excessiva, seguindo em frente com equilíbrio.", "lembrete": "Reconhecer sem dureza é mais sustentável do que se punir."}, {"titulo": "Honestidade que impede o retorno", "reflexao": "A honestidade diária comigo mesmo é o que impede que os velhos padrões voltem. É como uma vigilância gentil, não paranoica, que mantém minha atenção onde ela precisa estar.", "oracao": "Que minha honestidade diária continue impedindo o retorno dos padrões antigos.", "lembrete": "Honestidade diária é a vigilância gentil que protege o progresso."}, {"titulo": "Evitar que o erro cresça por dentro", "reflexao": "Cada vez que admito prontamente um erro, evito que ele cresça dentro de mim, se transformando em ressentimento, vergonha acumulada ou justificativa para recair.", "oracao": "Que eu evite que qualquer erro não admitido cresça silenciosamente dentro de mim.", "lembrete": "Erro admitido logo não cresce por dentro."}, {"titulo": "Ajustes diários, não perfeição constante", "reflexao": "Minha recuperação é feita de pequenos ajustes diários, não de perfeição constante. Aceito essa realidade com mais paz do que costumava aceitar antes, quando exigia de mim um padrão impossível de manter.", "oracao": "Que eu aceite os pequenos ajustes diários como parte normal e saudável da recuperação.", "lembrete": "Ajustes diários, não perfeição, sustentam a recuperação."}, {"titulo": "Revisar com a mesma honestidade de antes", "reflexao": "Hoje escolho revisar meu dia com a mesma honestidade que revisei meu passado durante o Quarto Passo. Essa prática contínua evita que eu volte a acumular verdades não ditas.", "oracao": "Que eu mantenha, no meu dia a dia, a mesma honestidade que pratiquei ao revisar meu passado.", "lembrete": "A honestidade do inventário passado continua no dia a dia de hoje."}, {"titulo": "Cuidar dos pequenos ressentimentos", "reflexao": "Não deixo ressentimentos pequenos se acumularem — cuido deles assim que aparecem. Um ressentimento pequeno, ignorado por tempo demais, tem o hábito de crescer silenciosamente até se tornar difícil de resolver.", "oracao": "Que eu cuide dos pequenos ressentimentos assim que eles aparecerem, sem deixá-los acumular.", "lembrete": "Ressentimento pequeno cuidado a tempo não vira problema grande."}, {"titulo": "Fortalecer o alicerce todos os dias", "reflexao": "Cada dia de inventário sincero fortalece o alicerce da minha recuperação. É um trabalho invisível na maior parte do tempo, mas cujo efeito acumulado sustenta tudo que já construí até aqui.", "oracao": "Que meu inventário diário continue fortalecendo, silenciosamente, o alicerce da minha recuperação.", "lembrete": "O inventário diário fortalece o alicerce, mesmo invisivelmente."}, {"titulo": "Integridade em dia", "reflexao": "Admitir estar errado não me diminui — mantém minha integridade em dia. Prefiro essa pequena incômoda verdade diária do que o acúmulo silencioso de coisas não ditas.", "oracao": "Que eu mantenha minha integridade em dia, admitindo estar errado sempre que necessário.", "lembrete": "Admitir o erro mantém a integridade em dia."}, {"titulo": "Sempre em processo", "reflexao": "Estou sempre em processo, e isso é exatamente como deveria ser. Não busco um estado final de recuperação completa — busco continuar, dia após dia, no processo contínuo de melhorar.", "oracao": "Que eu aceite estar sempre em processo, sem exigir um estado final impossível de recuperação completa.", "lembrete": "Estar sempre em processo é exatamente como deve ser."}, {"titulo": "Recaída evitada mais à frente", "reflexao": "Cada erro reconhecido a tempo é uma recaída evitada mais à frente. Vejo essa prática não como excesso de cuidado, mas como prevenção real, baseada em experiência própria.", "oracao": "Que o reconhecimento rápido dos meus erros continue evitando recaídas maiores no futuro.", "lembrete": "Erro reconhecido a tempo é recaída evitada depois."}, {"titulo": "Continuar sendo honesto", "reflexao": "Não preciso ser perfeito hoje — só preciso continuar sendo honesto. Essa é, na prática, a régua que uso para medir se estou indo bem: não perfeição, mas honestidade sustentada.", "oracao": "Que a honestidade continue sendo minha régua de medida, não a perfeição.", "lembrete": "Honestidade contínua, não perfeição, é a régua certa."}, {"titulo": "Manutenção tão importante quanto os grandes passos", "reflexao": "A manutenção diária da minha recuperação é tão importante quanto os grandes passos que já dei. Sem essa manutenção contínua, mesmo os avanços mais significativos correm o risco de se perder com o tempo.", "oracao": "Que eu valorize igualmente os grandes passos já dados e a manutenção diária que os sustenta.", "lembrete": "Manutenção diária sustenta os grandes passos já conquistados."}, {"titulo": "Terminar o dia em paz", "reflexao": "Cada noite, escolho terminar o dia em paz com minhas próprias ações. Isso não significa que tudo foi perfeito — significa que fiz as pazes com o que aconteceu, corrigindo o que precisava ser corrigido.", "oracao": "Que eu termine cada dia em paz, tendo corrigido o que precisava ser corrigido.", "lembrete": "Terminar o dia em paz não exige um dia perfeito."}, {"titulo": "Mais leve reconhecendo rápido", "reflexao": "Reconhecer um erro rapidamente é mais leve do que carregá-lo em silêncio por dias. Aprendi isso na prática: quanto mais espero para admitir algo, mais pesado esse algo fica dentro de mim.", "oracao": "Que eu reconheça meus erros rapidamente, evitando o peso de carregá-los em silêncio.", "lembrete": "Reconhecer rápido é mais leve que carregar em silêncio."}, {"titulo": "Proteger o amanhã com a honestidade de hoje", "reflexao": "Minha honestidade de hoje protege minha recuperação de amanhã. Não vejo essas duas coisas como separadas — a honestidade presente é o investimento direto na estabilidade futura.", "oracao": "Que minha honestidade de hoje continue protegendo a estabilidade da minha recuperação amanhã.", "lembrete": "A honestidade de hoje é proteção para o amanhã."}, {"titulo": "Evitar grandes reparações no futuro", "reflexao": "Cada pequeno ajuste diário evita que eu precise de grandes reparações no futuro. Prefiro o trabalho contínuo e discreto de hoje do que o trabalho intenso e doloroso que a negligência acumulada exigiria depois.", "oracao": "Que meus ajustes diários continuem evitando a necessidade de grandes reparações futuras.", "lembrete": "Ajuste pequeno hoje evita reparação grande amanhã."}, {"titulo": "Corrigir e seguir em frente", "reflexao": "Não guardo mágoas de mim mesmo — corrijo o que posso e sigo em frente. Guardar rancor de mim mesmo só adiciona um peso extra que não ajuda em nada o processo de melhorar de verdade.", "oracao": "Que eu corrija o que posso e siga em frente, sem guardar rancor de mim mesmo.", "lembrete": "Corrigir e seguir em frente vale mais que guardar rancor de si mesmo."}, {"titulo": "Um novo modo de vida", "reflexao": "A prática diária de honestidade é o que transforma recuperação em um novo modo de vida. Não é mais um esforço temporário — é, aos poucos, quem eu simplesmente sou agora.", "oracao": "Que a honestidade diária continue se tornando, cada vez mais, parte natural de quem eu sou.", "lembrete": "A prática diária transforma esforço em modo de vida."}, {"titulo": "Olhar sem medo, com vontade de melhorar", "reflexao": "Hoje escolho olhar para meu comportamento sem medo, apenas com vontade de melhorar. Essa mudança de postura — do medo para a vontade genuína — muda completamente como encaro este trabalho diário.", "oracao": "Que eu olhe para meu comportamento com vontade de melhorar, não com medo do que vou encontrar.", "lembrete": "Olhar com vontade de melhorar, não com medo."}, {"titulo": "Um cuidado com a própria recuperação", "reflexao": "Cada inventário diário, por menor que seja, é um cuidado que ofereço à minha própria recuperação. Vejo essa prática não como obrigação pesada, mas como um gesto de cuidado comigo mesmo.", "oracao": "Que eu continue oferecendo, todos os dias, esse cuidado simples à minha própria recuperação.", "lembrete": "O inventário diário é um cuidado, não uma obrigação pesada."}, {"titulo": "O orgulho que não impede mais", "reflexao": "Não deixo o orgulho me impedir de admitir quando estou errado. Essa é uma das mudanças mais profundas desde o início da minha recuperação — o orgulho que antes me travava, hoje tem cada vez menos poder sobre mim.", "oracao": "Que o orgulho continue perdendo espaço diante da minha disposição de admitir os erros.", "lembrete": "O orgulho perde força quando escolho admitir o erro."}, {"titulo": "Pequenas honestidades sustentando tudo", "reflexao": "Minha recuperação se sustenta nas pequenas honestidades do dia a dia — não em um único grande momento de virada, mas na soma de escolhas honestas repetidas, uma após a outra.", "oracao": "Que as pequenas honestidades diárias continuem sustentando toda a minha recuperação.", "lembrete": "Pequenas honestidades diárias sustentam a recuperação inteira."}, {"titulo": "Fechando o mês: revisar, ajustar, seguir", "reflexao": "Sigo revisando, ajustando e seguindo em frente — um dia de cada vez, sempre. Termino este mês com a certeza de que este trabalho de manutenção não tem data para acabar, e está tudo bem que seja assim.", "oracao": "Que eu continue, para sempre, revisando, ajustando e seguindo em frente, um dia de cada vez.", "lembrete": "Revisar, ajustar, seguir — sempre, um dia de cada vez."}, {"titulo": "Preparando o silêncio do próximo mês", "reflexao": "Encerro outubro percebendo que a honestidade diária que pratiquei aqui abre espaço para algo mais profundo: o contato consciente que o próximo passo vai pedir. A manutenção constante do comportamento prepara o terreno para a quietude que virá.", "oracao": "Que a honestidade praticada este mês prepare o terreno para a quietude e a escuta do próximo.", "lembrete": "A honestidade diária prepara o terreno para o silêncio que vem a seguir."}]}, {"month": "Novembro", "passo": "Passo 11", "tema": "Procuramos através da oração e meditação melhorar nosso contato consciente com Deus como O entendíamos, pedindo somente pelo conhecimento de Sua vontade perante a nós e a capacidade de realizá-la", "days": [{"titulo": "Reconexão diária", "reflexao": "Reservar um momento de silêncio todos os dias me reconecta com o que realmente importa. Não precisa ser longo — alguns minutos de quietude, praticados com constância, já fazem diferença perceptível no resto do dia.", "oracao": "Que eu reserve, todos os dias, um momento de silêncio para me reconectar com o que realmente importa.", "lembrete": "Reconexão diária não exige tempo longo, só constância."}, {"titulo": "Contato consciente, não respostas prontas", "reflexao": "Não busco respostas prontas na oração — busco apenas contato consciente comigo e com algo maior. Esse contato, por si só, já é valioso, independente de trazer soluções imediatas para meus problemas.", "oracao": "Que eu busque contato consciente, sem exigir respostas prontas em troca.", "lembrete": "O contato consciente já é valioso, com ou sem respostas prontas."}, {"titulo": "Quietude que fortalece o dia", "reflexao": "Cada momento de quietude que pratico fortalece minha serenidade para o resto do dia. Percebo essa diferença nos dias em que consigo praticar e nos dias em que, por algum motivo, acabo pulando esse momento.", "oracao": "Que meus momentos de quietude continuem fortalecendo minha serenidade ao longo do dia.", "lembrete": "A quietude praticada fortalece a serenidade do dia inteiro."}, {"titulo": "Constância, não perfeição", "reflexao": "A meditação não precisa ser perfeita. Precisa apenas ser praticada, com constância. Alguns dias minha mente vagueia mais do que outros — e está tudo bem, o importante é continuar tentando.", "oracao": "Que eu pratique com constância, sem exigir perfeição em cada momento de meditação.", "lembrete": "Constância vale mais que perfeição na prática da meditação."}, {"titulo": "Pausa antes do impulso", "reflexao": "Hoje escolho um momento de pausa antes de agir por impulso. Essa pausa, mesmo curta, tem sido uma das ferramentas mais úteis para evitar decisões precipitadas que eu poderia me arrepender depois.", "oracao": "Que eu pratique a pausa consciente antes de agir por impulso, em qualquer situação do dia.", "lembrete": "A pausa antes do impulso evita muitos arrependimentos."}, {"titulo": "Voltar ao presente", "reflexao": "Cada respiração consciente me traz de volta ao presente, longe da ansiedade do passado ou do futuro. Quando percebo minha mente se perdendo em preocupações, uso a respiração como âncora para retornar ao aqui e agora.", "oracao": "Que minha respiração continue me trazendo de volta ao presente, sempre que eu me perder em ansiedade.", "lembrete": "A respiração é a âncora que traz de volta ao presente."}, {"titulo": "Clareza para o próximo passo", "reflexao": "Não peço para saber tudo — peço apenas clareza para o próximo passo certo. Essa oração mais modesta, focada no imediato em vez do infinito, tem sido mais realista e mais útil na minha experiência diária.", "oracao": "Que eu tenha clareza suficiente para dar o próximo passo certo, sem exigir saber tudo de uma vez.", "lembrete": "Clareza para o próximo passo já é suficiente."}, {"titulo": "Força na quietude", "reflexao": "A quietude diária é onde encontro força para enfrentar o que o dia trouxer. Não é uma força que vem de fora de forma mágica — é uma força que se acumula justamente nesses momentos de pausa consciente.", "oracao": "Que a força que encontro na quietude me sustente diante dos desafios do dia.", "lembrete": "A força para o dia se acumula na quietude praticada."}, {"titulo": "Afastando a impulsividade antiga", "reflexao": "Cada momento de reflexão silenciosa me afasta um pouco mais da impulsividade antiga que guiava tantas das minhas decisões passadas. É um efeito gradual, mas real, percebido ao longo de semanas e meses de prática.", "oracao": "Que a prática da reflexão silenciosa continue me afastando da impulsividade antiga.", "lembrete": "Reflexão silenciosa afasta, aos poucos, a impulsividade antiga."}, {"titulo": "Conexão e presença bastam", "reflexao": "Não preciso de todas as respostas hoje. Preciso apenas de conexão e presença — com algo maior, comigo mesmo, com o momento em que estou vivendo agora, sem me perder em preocupações sobre o que ainda não aconteceu.", "oracao": "Que eu me contente com conexão e presença, sem exigir todas as respostas de uma vez.", "lembrete": "Conexão e presença já bastam, mesmo sem todas as respostas."}, {"titulo": "Ouvir além do barulho", "reflexao": "A prática diária de silêncio me ensina a ouvir além do barulho da ansiedade. Aos poucos, começo a distinguir entre o pensamento ansioso e algo mais quieto e mais verdadeiro que existe por baixo dele.", "oracao": "Que eu aprenda, cada vez mais, a ouvir além do barulho constante da ansiedade.", "lembrete": "O silêncio praticado ensina a ouvir além do barulho ansioso."}, {"titulo": "Fortalecer a recuperação em silêncio", "reflexao": "Cada dia que reservo um tempo para mim mesmo, fortaleço minha recuperação em silêncio — um trabalho invisível para os outros, mas profundamente sentido por dentro.", "oracao": "Que este tempo reservado para mim mesmo continue fortalecendo, em silêncio, toda a minha recuperação.", "lembrete": "O tempo reservado em silêncio fortalece a recuperação por dentro."}, {"titulo": "Observar sem fugir", "reflexao": "Não busco fugir dos meus pensamentos — busco observá-los com mais calma. Essa mudança de postura, de fuga para observação, tem sido uma das lições mais importantes que a meditação me ensinou.", "oracao": "Que eu observe meus pensamentos com calma, em vez de tentar fugir deles.", "lembrete": "Observar os pensamentos, sem fugir, traz mais calma."}, {"titulo": "Serenidade que se estende", "reflexao": "A serenidade que pratico na quietude se estende para o resto do meu dia. Percebo isso claramente nos dias em que reservo tempo para essa prática — o resto do dia flui de um jeito mais tranquilo.", "oracao": "Que a serenidade praticada na quietude continue se estendendo por todo o meu dia.", "lembrete": "A serenidade da quietude se estende para o dia inteiro."}, {"titulo": "Não estou sozinho nessa caminhada", "reflexao": "Cada momento de conexão consciente me lembra que não estou sozinho nessa caminhada. Mesmo em momentos de solidão física, a prática espiritual me conecta a algo maior, presente mesmo quando não estou acompanhado.", "oracao": "Que a conexão consciente me lembre, sempre, que não caminho sozinho.", "lembrete": "A conexão consciente lembra que não estou sozinho, mesmo em silêncio."}, {"titulo": "Pausar antes de decidir", "reflexao": "Hoje escolho pausar antes de reagir, e ouvir antes de decidir. Essas duas práticas simples — pausar e ouvir — mudaram significativamente a qualidade das minhas decisões cotidianas.", "oracao": "Que eu pause antes de reagir, e ouça antes de decidir, em cada situação do meu dia.", "lembrete": "Pausar e ouvir mudam a qualidade das decisões."}, {"titulo": "Um espaço só meu", "reflexao": "A meditação diária é um espaço só meu, sem pressa e sem julgamento. Não preciso justificar esse tempo para ninguém — ele é parte necessária do cuidado que dedico à minha própria recuperação.", "oracao": "Que eu proteja este espaço só meu, sem pressa e sem julgamento, todos os dias.", "lembrete": "O espaço da meditação é só meu, sem justificativas necessárias."}, {"titulo": "Investimento na estabilidade emocional", "reflexao": "Cada instante de silêncio praticado é um investimento na minha estabilidade emocional. Não vejo esses momentos como perda de tempo — vejo como um dos investimentos mais valiosos que faço em mim mesmo.", "oracao": "Que cada instante de silêncio continue sendo um investimento real na minha estabilidade emocional.", "lembrete": "O silêncio praticado é investimento direto na estabilidade emocional."}, {"titulo": "Pequenos momentos de clareza bastam", "reflexao": "Não preciso de grandes revelações — pequenos momentos de clareza já bastam para orientar meu próximo passo. Aprendo a valorizar essas pequenas iluminações cotidianas, em vez de esperar por algo grandioso.", "oracao": "Que eu valorize os pequenos momentos de clareza que já são suficientes para seguir em frente.", "lembrete": "Pequenos momentos de clareza já bastam para orientar o caminho."}, {"titulo": "Prática constante, mesmo em dias difíceis", "reflexao": "A prática constante, mesmo em dias difíceis, é o que sustenta minha serenidade. Especialmente nos dias mais desafiadores, é quando essa prática mais faz falta — e mais vale a pena manter.", "oracao": "Que eu mantenha a prática constante especialmente nos dias mais difíceis, quando mais preciso dela.", "lembrete": "A prática mais importa exatamente nos dias mais difíceis."}, {"titulo": "Pausa que evita reação impulsiva", "reflexao": "Cada pausa consciente que faço hoje evita uma reação impulsiva amanhã. Essa prática cumulativa — pausar hoje, pausar amanhã, pausar depois de amanhã — constrói um padrão mais saudável de resposta às situações difíceis.", "oracao": "Que cada pausa consciente de hoje evite reações impulsivas no futuro próximo.", "lembrete": "A pausa de hoje evita a reação impulsiva de amanhã."}, {"titulo": "Força para fazer o que é certo", "reflexao": "Busco, na quietude, força para fazer o que é certo, não o que é mais fácil. Essas duas coisas nem sempre coincidem, e é justamente nesses momentos de escolha difícil que a prática espiritual mais ajuda.", "oracao": "Que eu encontre, na quietude, força para escolher o que é certo, mesmo quando não for o mais fácil.", "lembrete": "A quietude dá força para escolher o certo, não só o fácil."}, {"titulo": "Conexão que acompanha o barulho", "reflexao": "A conexão que cultivo em silêncio me acompanha nos momentos mais barulhentos do dia. Não é uma conexão que existe só na meditação — ela se estende, silenciosamente, para os momentos mais agitados também.", "oracao": "Que a conexão cultivada em silêncio me acompanhe também nos momentos mais barulhentos do dia.", "lembrete": "A conexão silenciosa acompanha até os momentos mais agitados."}, {"titulo": "Ouvir mais, reagir menos", "reflexao": "Hoje escolho ouvir mais e reagir menos. Essa escolha simples, repetida em cada interação do dia, tem transformado significativamente a qualidade das minhas relações e das minhas decisões.", "oracao": "Que eu escolha, hoje e sempre, ouvir mais e reagir menos.", "lembrete": "Ouvir mais e reagir menos transforma as relações e as decisões."}, {"titulo": "Cuidado com a própria mente", "reflexao": "Cada momento de reflexão sincera é um cuidado que ofereço à minha própria mente. Assim como cuido do corpo com alimentação e descanso, cuido da mente com esses momentos de pausa e reflexão.", "oracao": "Que eu continue cuidando da minha mente com a mesma dedicação que cuido do meu corpo.", "lembrete": "A mente também precisa de cuidado diário, como o corpo."}, {"titulo": "Clareza possível de cada dia", "reflexao": "Não corro atrás de certezas absolutas — sigo em frente com a clareza possível de cada dia. Essa clareza parcial, renovada diariamente, é suficiente para me guiar sem me sobrecarregar com exigências impossíveis.", "oracao": "Que eu me contente com a clareza possível de cada dia, sem exigir certezas absolutas.", "lembrete": "A clareza possível de cada dia já é suficiente para seguir."}, {"titulo": "Devolvendo um pouco da paz tomada", "reflexao": "A prática diária de silêncio me devolve um pouco da paz que a compulsão havia tomado. É um processo lento de recuperação, mas percebo, com o tempo, quanto dessa paz já retornou para minha vida.", "oracao": "Que a prática diária de silêncio continue devolvendo a paz que a compulsão havia tomado.", "lembrete": "O silêncio devolve, aos poucos, a paz que a compulsão tomou."}, {"titulo": "A escolha de como reagir", "reflexao": "Cada respiração profunda é um lembrete de que posso escolher como reagir. Não controlo tudo que acontece ao meu redor, mas tenho cada vez mais controle sobre a forma como respondo a essas situações.", "oracao": "Que eu me lembre, a cada respiração profunda, de que posso escolher como reagir.", "lembrete": "A respiração lembra que a escolha da reação é minha."}, {"titulo": "Clareza para agir bem", "reflexao": "Busco clareza para agir bem, não perfeição para acertar sempre. Essa distinção me ajuda a seguir em frente com mais leveza, sem a pressão irreal de nunca cometer erros.", "oracao": "Que eu busque clareza para agir bem, em vez de perfeição impossível para acertar sempre.", "lembrete": "Clareza para agir bem vale mais que perfeição impossível."}, {"titulo": "Fechando o mês: serenidade construída em silêncio", "reflexao": "Termino este mês com a serenidade que comecei a construir em momentos simples de pausa e silêncio, praticados dia após dia. Sigo para o último passo, onde essa serenidade se transforma em serviço aos outros.", "oracao": "Que eu leve, para o próximo mês, a serenidade construída em silêncio, agora pronta para ser compartilhada.", "lembrete": "A serenidade construída em silêncio está pronta para ser compartilhada."}]}, {"month": "Dezembro", "passo": "Passo 12", "tema": "Tendo feito um esforço para praticar estes princípios em todas as nossas questões, procuramos levar esta mensagem a outros jogadores compulsivos", "days": [{"titulo": "Importar-se é o ingrediente", "reflexao": "Importar-se com os outros parece ser um ingrediente necessário e de grande relevância para trabalhar este passo. Se eu não me importo, como posso então compartilhar de verdade? Este mês, pratico esse cuidado genuíno com quem ainda está no início do caminho.", "oracao": "Que meu cuidado genuíno pelos outros seja o motor sincero do meu trabalho de serviço.", "lembrete": "Importar-se é o ingrediente essencial deste passo."}, {"titulo": "Autoajuda através de ajudar", "reflexao": "Se eu procurar ajudar outro ser humano, beneficio-me do ato de dar, mesmo se meus esforços falharem. É dando que recebemos — esse paradoxo, no início estranho, hoje faz todo sentido na minha experiência prática.", "oracao": "Que eu me beneficie do ato sincero de ajudar, independente do resultado que ele traga.", "lembrete": "É dando que se recebe — esse é o paradoxo deste passo."}, {"titulo": "Esforço e tentativa, não resultado garantido", "reflexao": "O sucesso neste passo é fazer o esforço e tentar transmitir a mensagem — não é quantos me deram ouvidos ou seguiram meus conselhos. Solto a expectativa de controlar o resultado, e me concentro apenas em oferecer o meu melhor esforço.", "oracao": "Que eu meça meu sucesso pelo esforço sincero, não pelo resultado que não controlo.", "lembrete": "Sucesso aqui é esforço, não resultado garantido."}, {"titulo": "Alguém que se importou o suficiente", "reflexao": "Não foi tanto o que foi dito quando alguém me ligou nos primeiros dias, mas sim o fato de que essa pessoa se importou o suficiente para fazer a chamada. Hoje, procuro ser essa pessoa para quem está começando.", "oracao": "Que eu seja, para quem precisa, a pessoa que se importa o suficiente para ligar, escrever, aparecer.", "lembrete": "O que importa muitas vezes não é o que se diz, mas o cuidado de aparecer."}, {"titulo": "Ser exemplo de abstinência com qualidade", "reflexao": "Uma das formas mais simples e poderosas de praticar este passo é ser um exemplo de abstinência com qualidade — não apenas parar de jogar, mas viver bem, com integridade, mostrando na prática que a recuperação é possível.", "oracao": "Que minha vida, vivida com qualidade e integridade, seja em si um exemplo de que a recuperação funciona.", "lembrete": "Viver bem já é uma forma silenciosa de mensagem."}, {"titulo": "Acompanhar outro membro", "reflexao": "Acompanhar outro membro em uma visita do Décimo Segundo Passo é uma das formas mais diretas de praticar este trabalho — estar presente, mesmo sem saber exatamente o que dizer, já faz diferença.", "oracao": "Que eu esteja disposto a acompanhar outra pessoa nessa caminhada, mesmo sem saber exatamente o que dizer.", "lembrete": "Estar presente já é, muitas vezes, suficiente."}, {"titulo": "Visitar quem está doente", "reflexao": "Visitar membros doentes, física ou emocionalmente fragilizados, é uma forma de serviço que não exige grandes discursos — apenas presença, atenção e cuidado genuíno com quem está passando por um momento difícil.", "oracao": "Que eu esteja disposto a visitar e cuidar de quem está fragilizado, sem esperar nada em troca.", "lembrete": "Visitar quem sofre é serviço, mesmo sem grandes palavras."}, {"titulo": "Um telefonema simples", "reflexao": "Telefonar para membros, sem motivo especial além de perguntar como estão, é uma prática pequena que pode significar muito para quem está do outro lado da linha, especialmente em dias mais difíceis.", "oracao": "Que meus telefonemas simples continuem sendo um gesto de cuidado genuíno com o grupo.", "lembrete": "Um telefonema simples pode significar muito para quem recebe."}, {"titulo": "Conversar depois das reuniões", "reflexao": "Conversar com os novos membros ou com aqueles que enfrentam problemas, logo depois das reuniões, é uma das formas mais naturais de praticar este passo — sem cerimônia, apenas presença disponível.", "oracao": "Que eu esteja disponível para conversar com quem precisar, especialmente depois das reuniões.", "lembrete": "A conversa simples depois da reunião também é serviço."}, {"titulo": "Assumir tarefas da Irmandade", "reflexao": "Assumir algumas das tarefas, obrigações e responsabilidades da Irmandade — preparar a sala, organizar o café, cuidar dos livros — é outra forma concreta de praticar este passo, mesmo sem envolver grandes conversas.", "oracao": "Que eu esteja disposto a assumir pequenas tarefas que sustentam o funcionamento do grupo.", "lembrete": "Tarefas pequenas também sustentam a Irmandade inteira."}, {"titulo": "Explicar a doença a quem precisa entender", "reflexao": "Explicar minha doença e como a tenho enfrentado a familiares, médicos e empregadores é também uma forma de levar a mensagem — não apenas dentro do grupo, mas para as pessoas que fazem parte da minha vida diária.", "oracao": "Que eu tenha coragem e clareza para explicar minha recuperação a quem precisa entender.", "lembrete": "Levar a mensagem também acontece fora das reuniões."}, {"titulo": "Contar a história para ajudar", "reflexao": "Contar minha história para ajudar um companheiro é um dos gestos mais diretos deste passo. Cada vez que compartilho o que vivi, ofereço a outra pessoa a chance de se identificar e encontrar esperança na minha experiência.", "oracao": "Que minha história, ao ser contada, continue oferecendo esperança para quem precisa ouvi-la.", "lembrete": "Contar a própria história pode ser exatamente o que outro precisa ouvir."}, {"titulo": "Trabalho de relações públicas", "reflexao": "Fazer trabalho de relações públicas para a Irmandade — ajudando outras pessoas a saberem que este grupo existe — é também uma forma de praticar o Décimo Segundo Passo, alcançando quem talvez ainda nem saiba que existe ajuda disponível.", "oracao": "Que eu contribua para que mais pessoas saibam que existe ajuda disponível para elas também.", "lembrete": "Divulgar a existência do grupo também é levar a mensagem."}, {"titulo": "Viver o programa em todas as áreas", "reflexao": "Praticar os princípios da recuperação em todas as áreas da minha vida — não só evitando o jogo, mas sendo mais honesto no trabalho, mais paciente em casa, mais presente com quem amo — é o verdadeiro objetivo de todo este caminho.", "oracao": "Que os princípios que aprendi aqui se estendam a todas as áreas da minha vida, não só à recuperação do jogo.", "lembrete": "O verdadeiro objetivo é viver os princípios em tudo, não só evitar o jogo."}, {"titulo": "Gratidão que se transforma em serviço", "reflexao": "A gratidão que sinto hoje, por tudo que já percorri, se transforma naturalmente em vontade de servir. Não é uma obrigação forçada — é uma resposta genuína ao muito que já recebi ao longo deste caminho.", "oracao": "Que minha gratidão continue se transformando, naturalmente, em disposição para servir.", "lembrete": "A gratidão genuína se transforma em serviço genuíno."}, {"titulo": "Presente para outro membro", "reflexao": "Estar presente para outro membro é uma das formas mais profundas de viver este programa. Não precisa ser um gesto grandioso — a presença simples, consistente, já comunica cuidado real.", "oracao": "Que minha presença consistente continue comunicando cuidado real para quem precisar.", "lembrete": "Presença simples e consistente já comunica cuidado profundo."}, {"titulo": "Ponte para a recuperação de outra pessoa", "reflexao": "Não escondo mais minha história — hoje ela pode ser ponte para a recuperação de outra pessoa. O que antes era motivo de vergonha, hoje se transforma em ferramenta de ajuda para quem ainda está no começo.", "oracao": "Que minha história, antes fonte de vergonha, continue sendo hoje uma ponte para ajudar outros.", "lembrete": "A própria história pode virar ponte para a recuperação alheia."}, {"titulo": "Esforço sincero, não sucesso garantido", "reflexao": "Ajudar não é sobre ter sucesso garantido — é sobre o esforço sincero de tentar. Aprendo a soltar a expectativa de que cada tentativa de ajudar vai funcionar perfeitamente, e a valorizar o esforço em si.", "oracao": "Que eu valorize o esforço sincero de ajudar, independente de garantias de sucesso.", "lembrete": "O esforço sincero já tem valor, com ou sem sucesso garantido."}, {"titulo": "Alguém disposto a se importar", "reflexao": "Cada pessoa nova que chega à sala merece encontrar alguém disposto a se importar — assim como eu encontrei quando cheguei, assustado e sem saber o que esperar. Hoje, procuro ser essa pessoa para outra.", "oracao": "Que eu seja, para quem chega novo, a pessoa disposta a se importar que eu mesmo encontrei um dia.", "lembrete": "Todo novo membro merece encontrar alguém disposto a se importar."}, {"titulo": "Gratidão olhando para trás", "reflexao": "A gratidão que sinto hoje nasce de olhar para o quanto já percorri desde o início desta jornada. Comparar o presente com o passado, não com um ideal impossível, me ajuda a reconhecer o tamanho real do progresso.", "oracao": "Que eu continue reconhecendo, com gratidão, o quanto já percorri até aqui.", "lembrete": "A gratidão nasce de olhar para trás e reconhecer o caminho percorrido."}, {"titulo": "Devolvendo mais do que recebi jogando", "reflexao": "Cada gesto de generosidade na recuperação devolve mais do que jamais recebi jogando. O prazer momentâneo do jogo nunca se comparou à satisfação duradoura de ajudar outra pessoa a encontrar o mesmo caminho que encontrei.", "oracao": "Que a generosidade que pratico continue devolvendo mais do que qualquer coisa que o jogo já me deu.", "lembrete": "A generosidade devolve mais do que o jogo jamais deu."}, {"titulo": "Agradecer através do serviço", "reflexao": "Servir aos outros é a forma mais concreta de agradecer pela minha própria recuperação. Não preciso apenas dizer que sou grato — posso demonstrar essa gratidão através de ações reais de serviço ao grupo.", "oracao": "Que meu serviço continue sendo a forma mais concreta de expressar minha gratidão.", "lembrete": "Servir é a gratidão colocada em prática."}, {"titulo": "A diferença entre desistir e continuar", "reflexao": "Um telefonema simples pode significar, para alguém, a diferença entre desistir e continuar. Levo essa possibilidade a sério — nunca sei exatamente o impacto real de um gesto pequeno de cuidado.", "oracao": "Que eu nunca subestime o impacto real de um gesto pequeno de cuidado com outra pessoa.", "lembrete": "Um gesto pequeno pode ser, para alguém, a diferença entre desistir e continuar."}, {"titulo": "Exemplo silencioso", "reflexao": "Cada dia limpo que vivo é também um exemplo silencioso para quem ainda está começando. Não preciso anunciar meu progresso — ele fala por si mesmo através da forma como escolho viver, dia após dia.", "oracao": "Que meus dias vividos com integridade continuem sendo exemplo silencioso para quem observa.", "lembrete": "Viver bem já é, silenciosamente, um exemplo para os outros."}, {"titulo": "Recuperação vivida em comunidade", "reflexao": "A recuperação se fortalece quando é vivida em comunidade, não em isolamento. Cada vínculo que construo dentro do grupo fortalece não apenas a mim, mas a rede de apoio que sustenta todos os membros juntos.", "oracao": "Que minha recuperação continue se fortalecendo através dos vínculos construídos em comunidade.", "lembrete": "Recuperação em comunidade é mais forte que recuperação isolada."}, {"titulo": "Ser para o outro o que alguém foi para mim", "reflexao": "Hoje escolho ser, para outra pessoa, o que alguém já foi para mim — nos meus momentos mais difíceis, quando eu mais precisava de alguém que se importasse. Esse ciclo de cuidado é o que sustenta toda a Irmandade.", "oracao": "Que eu continue sendo, para outra pessoa, o cuidado que recebi quando mais precisei.", "lembrete": "O ciclo de cuidado se sustenta quando cada um retribui o que recebeu."}, {"titulo": "Gratidão alimentada pelo serviço", "reflexao": "Cada ato de serviço, por menor que seja, alimenta minha própria gratidão. É um ciclo positivo: sirvo porque sou grato, e sendo grato, sirvo ainda mais, fortalecendo minha própria recuperação no processo.", "oracao": "Que meu serviço continue alimentando, e sendo alimentado por, minha própria gratidão.", "lembrete": "Serviço e gratidão se alimentam mutuamente."}, {"titulo": "Um ano diferente do que começou", "reflexao": "Termino este ano diferente de como comecei — e essa mudança merece ser celebrada, não minimizada. Olho para os últimos doze meses com orgulho genuíno do trabalho que fiz, passo a passo, mês a mês.", "oracao": "Que eu celebre genuinamente a diferença entre quem eu era no início deste ano e quem sou agora.", "lembrete": "A mudança ao longo do ano merece ser celebrada, não minimizada."}, {"titulo": "Cada passo silencioso importou", "reflexao": "Cada passo dado ao longo deste ano importa, mesmo os mais silenciosos — os dias comuns em que simplesmente segui em frente, sem grandes acontecimentos, mas com consistência. Esses dias silenciosos formam a maior parte da minha recuperação.", "oracao": "Que eu reconheça o valor dos dias silenciosos, que formaram a maior parte da minha jornada este ano.", "lembrete": "Os dias silenciosos e consistentes formam a maior parte do progresso."}, {"titulo": "Levar a mensagem adiante", "reflexao": "Levar esta mensagem adiante é a forma mais completa de viver os 12 Passos. Ao terminar este ciclo de reflexões diárias, entendo que o trabalho não termina aqui — ele se renova, começando de novo, sempre que alguém precisar ouvir que a recuperação é possível.", "oracao": "Que eu continue levando esta mensagem adiante, para quem ainda precisa ouvir que a recuperação é possível.", "lembrete": "Levar a mensagem adiante é viver os 12 Passos por completo."}, {"titulo": "Só por hoje, mais uma vez", "reflexao": "Só por hoje, e amanhã de novo só por hoje: assim se constrói uma vida nova. Encerro este ciclo de doze meses de reflexão sabendo que amanhã começo de novo, com a mesma simplicidade e a mesma disposição de sempre — um dia de cada vez, para sempre.", "oracao": "Que eu continue, todos os dias que ainda virão, escolhendo viver só por hoje, um dia de cada vez.", "lembrete": "Só por hoje — e amanhã, de novo, só por hoje."}]}];
const STORAGE_KEY = 'recuperacao365_progress_v1';

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(progress){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}

let progress = loadProgress(); // { "1-1": "2026-07-22", "1-2": "..." }

function dayKey(monthIdx, dayNum){ return monthIdx + '-' + dayNum; }

function dayOfYearIndex(monthIdx, dayNum){
  let count = 0;
  for (let i = 0; i < monthIdx; i++) count += DATA.months[i].phrases.length;
  return count + (dayNum - 1); // 0-based
}

function getOpener(monthIdx, dayNum){
  const idx = dayOfYearIndex(monthIdx, dayNum) % OPENERS.length;
  return OPENERS[idx];
}

function getAfternoonOpener(monthIdx, dayNum){
  const idx = dayOfYearIndex(monthIdx, dayNum) % AFTERNOON_OPENERS.length;
  return AFTERNOON_OPENERS[idx];
}

function getEveningOpener(monthIdx, dayNum){
  const idx = dayOfYearIndex(monthIdx, dayNum) % EVENING_OPENERS.length;
  return EVENING_OPENERS[idx];
}

function todayMonthDay(){
  const now = new Date();
  return { month: now.getMonth(), day: now.getDate() };
}

function formatDateBR(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR');
}

function totalPhrases(){
  return DATA.months.reduce((sum, m) => sum + m.phrases.length, 0);
}

function updateProgressPanel(){
  const doneCount = Object.keys(progress).length;
  document.getElementById('progressCount').textContent = doneCount + ' / ' + totalPhrases();
  const pct = Math.round((doneCount / totalPhrases()) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
}

function copyToClipboard(text, btn, originalLabel){
  const label = originalLabel || btn.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copiado!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = label;
      btn.classList.remove('copied');
    }, 1500);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = 'Copiado!';
    setTimeout(() => { btn.textContent = label; }, 1500);
  });
}

// Creates a toggle button + editable preview panel pair.
// toggleLabel: text shown on the toggle button when closed.
// composeFn: function returning the initial message text.
// Returns { toggleBtn, panel } — caller appends toggleBtn to an actions row
// and panel to the day content.
function createPreviewToggle(toggleLabel, composeFn){
  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'copy-btn ghost';
  toggleBtn.textContent = toggleLabel;

  const panel = document.createElement('div');
  panel.className = 'message-preview-panel';

  const textarea = document.createElement('textarea');
  textarea.className = 'message-preview-textarea';

  const panelActions = document.createElement('div');
  panelActions.className = 'day-actions';
  panelActions.style.marginTop = '8px';

  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = 'Copiar';
  copyBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    copyToClipboard(textarea.value, copyBtn, 'Copiar');
  });

  const resetBtn = document.createElement('button');
  resetBtn.className = 'copy-btn ghost';
  resetBtn.textContent = 'Restaurar original';
  resetBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    textarea.value = composeFn();
  });

  panelActions.appendChild(copyBtn);
  panelActions.appendChild(resetBtn);
  panel.appendChild(textarea);
  panel.appendChild(panelActions);

  toggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = panel.classList.toggle('open');
    if (isOpen && !textarea.dataset.loaded) {
      textarea.value = composeFn();
      textarea.dataset.loaded = '1';
      const lines = textarea.value.split('\n').length;
      textarea.rows = Math.min(Math.max(lines + 1, 3), 14);
    }
    toggleBtn.textContent = isOpen ? 'Fechar' : toggleLabel;
  });

  return { toggleBtn, panel };
}

function getISOWeekInfo(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // Monday = 0
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const weekNum = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);

  const monday = new Date(date);
  monday.setDate(date.getDate() - ((date.getDay() + 6) % 7));
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);

  return { week: weekNum, monday, sunday };
}

function formatShortDate(d){
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}

function renderVirtueCard(){
  const now = new Date();
  const { week, monday, sunday } = getISOWeekInfo(now);
  const idx = (week - 1) % VIRTUES.length;
  const pair = VIRTUES[idx];

  document.getElementById('virtueWeekRange').textContent =
    'Semana ' + week + ' · ' + formatShortDate(monday) + ' a ' + formatShortDate(sunday);

  document.getElementById('virtuePair').innerHTML =
    pair.defeito + '<span class="arrow">→</span>' + pair.virtude;

  const message =
    'Defeito da semana: ' + pair.defeito + '\nVirtude: ' + pair.virtude + '\n\n' +
    'Essa semana, vamos observar onde o(a) ' + pair.defeito.toLowerCase() +
    ' aparece no nosso dia a dia. Não precisa resolver — só perceber.\n\n' +
    'No fim da semana: em que momento você notou a ' + pair.virtude.toLowerCase() +
    ' aparecer no lugar do(a) ' + pair.defeito.toLowerCase() + '?';

  document.getElementById('virtueMessage').textContent = message;

  const btn = document.getElementById('copyVirtueBtn');
  btn.onclick = () => copyToClipboard(message, btn, 'Copiar mensagem para o grupo');
}

    header.className = 'month-header';
    const doneInMonth = month.phrases.filter((_, i) => progress[dayKey(mIdx, i+1)]).length;
    header.innerHTML = '<div class="m-left"><span class="chevron">▾</span><h2>' + month.name + '</h2><span class="step-tag">' + month.passo + '</span></div><span class="m-count">' + doneInMonth + '/' + month.phrases.length + '</span>';
    header.addEventListener('click', () => {
      block.classList.toggle('collapsed');
    });
    block.appendChild(header);

    const theme = document.createElement('div');
    theme.className = 'month-theme';
    theme.textContent = month.tema;
    block.appendChild(theme);

    if (month.devocional) {
      const devo = document.createElement('div');
      devo.className = 'devotional';
      const label = document.createElement('span');
      label.className = 'dev-label';
      label.textContent = 'Devocional do mês — ' + month.passo;
      const text = document.createElement('div');
      text.textContent = month.devocional;
      devo.appendChild(label);
      devo.appendChild(text);
      block.appendChild(devo);
    }

    const list = document.createElement('div');
    list.className = 'day-list';

    let visibleCount = 0;

    month.phrases.forEach((phrase, i) => {
      const day = i + 1;
      const key = dayKey(mIdx, day);
      const isDone = !!progress[key];

      if (searchTerm && !phrase.toLowerCase().includes(searchTerm)) return;
      if (filterMode === 'pending' && isDone) return;
      if (filterMode === 'done' && !isDone) return;
      visibleCount++;

      const row = document.createElement('div');
      row.className = 'day-row' + (isDone ? ' done' : '');
      row.id = 'day-' + mIdx + '-' + day;

      const tick = document.createElement('button');
      tick.className = 'tick';
      tick.setAttribute('aria-label', 'Marcar como enviada');
      tick.textContent = isDone ? '✓' : '';
      tick.addEventListener('click', () => {
        if (progress[key]) {
          delete progress[key];
        } else {
          progress[key] = new Date().toISOString();
        }
        saveProgress(progress);
        render();
      });

      const content = document.createElement('div');
      content.className = 'day-content';

      const meta = document.createElement('div');
      meta.className = 'day-meta';
      let metaHtml = 'Dia ' + day;
      if (isDone) {
        metaHtml += ' · <span class="sent-date">enviada em ' + formatDateBR(progress[key]) + '</span>';
      }
      meta.innerHTML = metaHtml;

      const phraseEl = document.createElement('div');
      phraseEl.className = 'day-phrase';
      phraseEl.textContent = phrase;

      const actions = document.createElement('div');
      actions.className = 'day-actions';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Copiar frase';
      copyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        copyToClipboard(phrase, copyBtn, 'Copiar frase');
      });
      actions.appendChild(copyBtn);

      const openerPreview = createPreviewToggle('Ver mensagem de abertura', () => {
        const opener = getOpener(mIdx, day);
        return opener + '\n\n' + phrase;
      });
      actions.appendChild(openerPreview.toggleBtn);

      const afternoonPreview = createPreviewToggle('Ver mensagem de tarde', () => {
        const greeting = getAfternoonOpener(mIdx, day);
        const afternoonEntry = (AFTERNOON_PHRASES[mIdx] && AFTERNOON_PHRASES[mIdx].days[day - 1]) || null;
        let afternoonMsg = greeting;
        if (afternoonEntry) {
          afternoonMsg += '\n\n' + afternoonEntry.frase;
        }
        return afternoonMsg;
      });
      actions.appendChild(afternoonPreview.toggleBtn);

      const eveningPreview = createPreviewToggle('Ver mensagem de noite', () => {
        const eveningOpener = getEveningOpener(mIdx, day);
        const meditationForDay = (MEDITATIONS[mIdx] && MEDITATIONS[mIdx].days[day - 1]) || null;
        let eveningMsg = eveningOpener;
        if (meditationForDay) {
          eveningMsg += '\n\n' + meditationForDay.lembrete;
        }
        return eveningMsg;
      });
      actions.appendChild(eveningPreview.toggleBtn);

      const meditation = (MEDITATIONS[mIdx] && MEDITATIONS[mIdx].days[day - 1]) || null;
      const isLastDayOfMonth = day === month.phrases.length;
      let medPanel = null;
      if (meditation) {
        const medToggleBtn = document.createElement('button');
        medToggleBtn.className = 'copy-btn ghost';
        medToggleBtn.textContent = 'Ler meditação completa';
        actions.appendChild(medToggleBtn);

        medPanel = document.createElement('div');
        medPanel.className = 'meditation-panel';
        medPanel.innerHTML =
          '<div class="med-title">' + meditation.titulo + '</div>' +
          '<div class="med-section"><div class="med-label">Reflexão do Dia</div><div class="med-text">' + meditation.reflexao + '</div></div>' +
          '<div class="med-section"><div class="med-label">Hoje Eu Rezo</div><div class="med-text med-oracao">' + meditation.oracao + '</div></div>' +
          '<div class="med-section"><div class="med-label">Hoje Eu Me Lembrarei</div><div class="med-text med-lembrete">' + meditation.lembrete + '</div></div>';

        if (isLastDayOfMonth) {
          const prayerSection = document.createElement('div');
          prayerSection.className = 'med-section serenity-section';
          prayerSection.innerHTML =
            '<div class="med-label">Fechando o Passo — Oração da Serenidade</div>' +
            '<div class="med-text med-oracao">' + SERENITY_PRAYER + '</div>';
          medPanel.appendChild(prayerSection);
        }

        const medActions = document.createElement('div');
        medActions.className = 'day-actions';
        medActions.style.marginTop = '10px';
        const copyMedBtn = document.createElement('button');
        copyMedBtn.className = 'copy-btn';
        copyMedBtn.textContent = 'Copiar meditação';
        copyMedBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          let fullMed = meditation.titulo + '\n\nReflexão do Dia\n' + meditation.reflexao +
            '\n\nHoje Eu Rezo\n' + meditation.oracao + '\n\nHoje Eu Me Lembrarei\n' + meditation.lembrete;
          if (isLastDayOfMonth) {
            fullMed += '\n\nOração da Serenidade\n' + SERENITY_PRAYER;
          }
          copyToClipboard(fullMed, copyMedBtn, 'Copiar meditação');
        });
        medActions.appendChild(copyMedBtn);
        medPanel.appendChild(medActions);

        medToggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          medPanel.classList.toggle('open');
          medToggleBtn.textContent = medPanel.classList.contains('open') ? 'Fechar meditação' : 'Ler meditação completa';
        });
      }

      content.appendChild(meta);
      content.appendChild(phraseEl);
      content.appendChild(actions);
      content.appendChild(openerPreview.panel);
      content.appendChild(afternoonPreview.panel);
      content.appendChild(eveningPreview.panel);
      if (medPanel) content.appendChild(medPanel);

      row.appendChild(tick);
      row.appendChild(content);
      list.appendChild(row);
    });

    if (visibleCount === 0) {
      block.style.display = 'none';
    } else {
      block.style.display = '';
    }

    block.appendChild(list);
    container.appendChild(block);
  });

  updateProgressPanel();
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('filterSelect').addEventListener('change', render);
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Tem certeza que quer zerar todo o progresso de envio? Essa ação não pode ser desfeita.')) {
    progress = {};
    saveProgress(progress);
    render();
  }
});
function jumpToMonth(monthIdx, highlightDay){
  const block = document.getElementById('month-' + monthIdx);
  if (!block) return;
  block.classList.remove('collapsed');
  block.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (highlightDay) {
    const dayRow = document.getElementById('day-' + monthIdx + '-' + highlightDay);
    if (dayRow) {
      setTimeout(() => {
        dayRow.style.outline = '2px solid #B98B45';
        dayRow.style.outlineOffset = '2px';
        setTimeout(() => { dayRow.style.outline = 'none'; }, 2000);
      }, 400);
    }
  }
}

function renderStepsMap(){
  const container = document.getElementById('stepsMap');
  if (!container) return;
  container.innerHTML = '';
  const today = todayMonthDay();

  DATA.months.forEach((month, mIdx) => {
    const node = document.createElement('button');
    node.className = 'step-node' + (mIdx === today.month ? ' current' : '');
    node.innerHTML =
      '<span class="step-num">' + (mIdx + 1) + '</span>' +
      '<span class="step-node-label">' + month.passo + '</span>' +
      '<span class="step-node-month">' + month.name + '</span>';
    node.addEventListener('click', () => {
      jumpToMonth(mIdx, mIdx === today.month ? today.day : null);
    });
    container.appendChild(node);

    if (mIdx < DATA.months.length - 1) {
      const connector = document.createElement('div');
      connector.className = 'step-connector';
      container.appendChild(connector);
    }
  });
}

document.getElementById('jumpTodayBtn').addEventListener('click', () => {
  const today = todayMonthDay();
  jumpToMonth(today.month, today.day);
});

render();
renderVirtueCard();
renderStepsMap();
</script>
</body>
</html>
