<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>365 Dias de Recuperação — Controle de Envio</title>
<style>
  :root{
    --bg: #F6F4EF;
    --bg-card: #FFFFFF;
    --ink: #23342E;
    --ink-soft: #5B6B64;
    --sage: #4E6B5C;
    --sage-light: #DCE7DF;
    --gold: #B98B45;
    --line: #E4E0D6;
    --done-bg: #EEF3EC;
    --done-line: #4E6B5C;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Iowan Old Style', 'Georgia', 'Charter', serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap{max-width: 880px; margin: 0 auto; padding: 32px 20px 120px;}

  header.top{
    text-align:center;
    padding: 28px 10px 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }
  header.top h1{
    font-size: 1.9rem;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    font-weight: 600;
    color: var(--sage);
  }
  header.top p{
    margin: 0;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 1.02rem;
  }

  .progress-panel{
    display:flex;
    align-items:center;
    gap: 18px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 22px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .progress-ring-label{
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .progress-count{
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--sage);
    font-family: 'Iowan Old Style', Georgia, serif;
  }
  .progress-bar-track{
    flex: 1;
    height: 8px;
    background: var(--sage-light);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar-fill{
    height: 100%;
    background: var(--sage);
    width: 0%;
    transition: width 0.4s ease;
  }
  .today-btn{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.82rem;
    background: var(--sage);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .today-btn:hover{ background:#3d5648; }

  .steps-map-wrap{
    margin-bottom: 22px;
  }
  .steps-map-label{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .steps-map{
    display: flex;
    align-items: center;
    overflow-x: auto;
    padding: 6px 2px 14px;
    gap: 0;
  }
  .step-node{
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-width: 78px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .step-node:hover{ border-color: var(--sage); background: var(--sage-light); }
  .step-node.current{
    border-color: var(--gold);
    background: #FBF3E7;
  }
  .step-num{
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--sage-light);
    color: var(--sage);
    font-size: 0.78rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-node.current .step-num{
    background: var(--gold);
    color: #fff;
  }
  .step-node-label{
    font-size: 0.68rem;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.2;
  }
  .step-node-month{
    font-size: 0.72rem;
    color: var(--ink);
    font-weight: 600;
    text-align: center;
  }
  .step-connector{
    flex-shrink: 0;
    width: 20px;
    height: 2px;
    background: var(--line);
    margin: 0 2px;
    align-self: center;
    margin-bottom: 20px;
  }

  .controls{
    display:flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .controls input[type="text"]{
    flex:1;
    min-width: 160px;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 0.92rem;
    background: var(--bg-card);
  }
  select#filterSelect{
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    font-size: 0.88rem;
    color: var(--ink);
  }

  .month-block{ margin-bottom: 18px; }
  .month-header{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 4px;
    cursor: pointer;
    border-bottom: 2px solid var(--sage-light);
  }
  .month-header .m-left{ display:flex; align-items:baseline; flex-wrap: wrap; gap: 10px;}
  .month-header h2{
    margin:0;
    font-size: 1.25rem;
    color: var(--sage);
    font-weight: 600;
  }
  .month-header .step-tag{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
    background: #FBF3E7;
    border: 1px solid #EDD9B6;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .month-header .m-count{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .month-theme{
    font-size: 0.86rem;
    font-style: italic;
    color: var(--ink-soft);
    padding: 6px 4px 10px;
  }
  .devotional{
    background: #FBF8F1;
    border: 1px solid #EEE3CE;
    border-left: 3px solid var(--gold);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 4px 4px 16px;
    font-size: 0.96rem;
    line-height: 1.65;
    color: var(--ink);
  }
  .devotional .dev-label{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .virtue-card{
    background: var(--sage-light);
    border: 1px solid #C9DACD;
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 22px;
  }
  .serenity-section{
    background: #FBF3E7;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 4px;
  }
  .virtue-card-header{
    display:flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 10px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .virtue-card .dev-label{
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sage);
    font-weight: 700;
  }
  .virtue-week-range{
    font-size: 0.76rem;
    color: var(--ink-soft);
  }
  .virtue-pair{
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .virtue-pair .arrow{ color: var(--sage); margin: 0 8px; }
  .virtue-message{
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--ink);
    white-space: pre-line;
    background: var(--bg-card);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .chevron{
    display:inline-block;
    transition: transform 0.2s ease;
    color: var(--ink-soft);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .month-block.collapsed .chevron{ transform: rotate(-90deg); }
  .month-block.collapsed .day-list, .month-block.collapsed .month-theme, .month-block.collapsed .devotional{ display:none; }

  .day-list{ padding: 4px 0 14px; }
  .day-row{
    display:flex;
    gap: 14px;
    align-items:flex-start;
    padding: 13px 8px;
    border-radius: 10px;
    transition: background 0.15s ease;
  }
  .day-row:hover{ background: #FBFAF6; }
  .day-row.done{ background: var(--done-bg); }

  .tick{
    flex-shrink:0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--sage);
    background: transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color: #fff;
    font-size: 0.85rem;
    margin-top: 2px;
  }
  .day-row.done .tick{ background: var(--sage); }

  .day-content{ flex:1; min-width:0; }
  .day-meta{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 3px;
    display:flex;
    gap: 8px;
    align-items:center;
  }
  .day-meta .sent-date{ color: var(--sage); }
  .day-phrase{
    font-size: 1.02rem;
    line-height: 1.5;
    color: var(--ink);
  }
  .day-row.done .day-phrase{ color: var(--ink-soft); }

  .day-actions{
    display:flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .copy-btn{
    font-size: 0.78rem;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--sage);
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .copy-btn:hover{ border-color: var(--sage); background: var(--sage-light); }
  .copy-btn.copied{ background: var(--sage); color:#fff; border-color: var(--sage); }
  .copy-btn.ghost{ color: var(--gold); }
  .copy-btn.ghost:hover{ border-color: var(--gold); background: #FBF3E7; }

  .message-preview-panel{
    display: none;
    margin-top: 10px;
  }
  .message-preview-panel.open{ display: block; }
  .message-preview-textarea{
    width: 100%;
    box-sizing: border-box;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--ink);
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    resize: vertical;
  }
  .message-preview-textarea:focus{
    outline: none;
    border-color: var(--sage);
  }

  .meditation-panel{
    display: none;
    margin-top: 12px;
    padding: 16px 18px;
    background: #FBFAF6;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .meditation-panel.open{ display: block; }
  .meditation-panel h4{
    margin: 0 0 6px;
    font-size: 0.72rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--sage);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .meditation-panel .med-title{
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .meditation-panel .med-section{ margin-bottom: 12px; }
  .meditation-panel .med-section:last-child{ margin-bottom: 0; }
  .meditation-panel .med-label{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .meditation-panel .med-text{
    font-size: 0.94rem;
    line-height: 1.6;
    color: var(--ink);
  }
  .meditation-panel .med-oracao{ font-style: italic; }
  .meditation-panel .med-lembrete{ font-weight: 700; color: var(--sage); }

  footer{
    text-align:center;
    margin-top: 30px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  footer button{
    background:none;
    border: none;
    text-decoration: underline;
    color: var(--ink-soft);
    cursor:pointer;
    font-size: 0.78rem;
  }

  @media (max-width: 520px){
    .wrap{ padding: 20px 14px 100px; }
    header.top h1{ font-size: 1.5rem; }
    .progress-panel{ flex-wrap: wrap; }
    .steps-map{ gap: 0; }
    .step-node{ min-width: 68px; padding: 8px 9px; }
    .step-node-label{ font-size: 0.62rem; }
    .day-actions{ gap: 5px; }
    .copy-btn{ font-size: 0.74rem; padding: 5px 10px; }
    .virtue-pair{ font-size: 1.1rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>365 Dias de Recuperação</h1>
    <p>Frase, devocional e controle de envio — só por hoje, um passo de cada vez.</p>
  </header>

  <div class="progress-panel">
    <div>
      <div class="progress-ring-label">Enviadas</div>
      <div class="progress-count" id="progressCount">0 / 365</div>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    <button class="today-btn" id="jumpTodayBtn">Ir para hoje</button>
  </div>

  <div class="steps-map-wrap">
    <div class="steps-map-label">Mapa dos 12 Passos</div>
    <div class="steps-map" id="stepsMap"></div>
  </div>

  <div class="virtue-card" id="virtueCard">
    <div class="virtue-card-header">
      <span class="dev-label">Defeito × Virtude da semana</span>
      <span class="virtue-week-range" id="virtueWeekRange"></span>
    </div>
    <div class="virtue-pair" id="virtuePair"></div>
    <div class="virtue-message" id="virtueMessage"></div>
    <div class="day-actions">
      <button class="copy-btn" id="copyVirtueBtn">Copiar mensagem para o grupo</button>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Buscar por palavra na frase...">
    <select id="filterSelect">
      <option value="all">Todas as frases</option>
      <option value="pending">Só pendentes</option>
      <option value="done">Só enviadas</option>
    </select>
  </div>

  <div id="monthsContainer"></div>

  <footer>
    <p>Seu progresso fica salvo neste navegador.</p>
    <button id="resetBtn">Zerar todo o progresso</button>
  </footer>

</div>

const DATA = {"months": [{"name": "Janeiro", "passo": "Passo 1", "tema": "Admitimos que éramos impotentes perante o jogo", "devocional": "O Primeiro Passo não pede perfeição — pede honestidade. Por muito tempo, a ilusão de que ainda tínhamos controle foi o que mais nos aprisionou: cada perda parecia pedir só mais uma tentativa, e cada ganho parecia provar que estávamos no comando. Admitir que a vida ficou ingovernável não é um sinal de fraqueza de caráter, é o momento em que finalmente paramos de lutar sozinhos contra algo maior do que nós. É desconfortável olhar de frente para o tamanho do estrago. Mas é exatamente esse olhar honesto, sem disfarces, que abre a primeira porta da recuperação. Este mês, a prática é simples: dizer a verdade sobre onde estamos, um dia de cada vez.", "phrases": ["Admitir que preciso de ajuda não é fraqueza — é o primeiro ato de coragem da minha recuperação.", "Hoje eu escolho a verdade, mesmo quando ela dói mais do que a mentira que eu já contava a mim mesmo.", "Não preciso resolver minha vida inteira hoje. Preciso apenas não jogar hoje.", "A ilusão de controle foi o que mais me custou. Hoje eu solto essa ilusão.", "Reconhecer que perdi o controle é o início de recuperá-lo, de outra forma.", "Cada dia sem jogar é uma prova de que a impotência não é o fim da minha história.", "A honestidade comigo mesmo é o primeiro tijolo da casa que estou reconstruindo.", "Não estou sozinho nesta sala. Nunca mais precisarei estar.", "Minha vida ficou ingovernável porque eu tentava governá-la sozinho. Hoje eu peço ajuda.", "O jogo prometia alívio e entregou caos. Hoje escolho o caminho mais devagar da recuperação.", "Aceitar que sou impotente perante o jogo não me torna fraco — me torna livre para buscar outra força.", "Cada 'só mais uma vez' que eu não disser hoje é uma vitória silenciosa.", "A verdade sobre onde estou é o único lugar de onde posso começar a sair.", "Hoje eu escolho parar de fingir que estava tudo bem.", "Não é vergonha reconhecer a queda. Vergonha seria continuar caindo sozinho.", "Minha recuperação começa toda manhã com uma decisão simples: hoje, não.", "Eu não cheguei aqui por fraqueza de caráter. Cheguei aqui porque finalmente tive coragem de olhar.", "A primeira aposta sempre prometia mais do que entregava. A recuperação entrega mais do que promete.", "Hoje não preciso vencer a doença inteira. Só preciso vencer as próximas 24 horas.", "Reconhecer a derrota para o jogo é o começo da verdadeira virada da minha história.", "Estou aqui porque decidi parar de lutar sozinho contra algo maior do que eu.", "A cada dia que reconheço meus limites, fico mais perto de recuperar minha vida.", "Não existe recuperação sem primeiro admitir que algo estava profundamente errado.", "Hoje escolho a realidade, por mais difícil que seja, no lugar da fantasia do próximo giro.", "O primeiro passo não pede que eu seja perfeito. Pede que eu seja honesto.", "Cada recaída no passado não apaga o valor de recomeçar hoje.", "Minha vida ingovernável de ontem não define o que ela pode ser amanhã.", "Reconhecer o problema é diferente de ser definido por ele. Eu sou mais do que minha compulsão.", "Hoje é dia de coragem simples: dizer a verdade sobre onde estou.", "Um dia de honestidade vale mais do que anos fingindo que estava tudo sob controle.", "Não jogar hoje é suficiente. Amanhã cuido de amanhã."]}, {"name": "Fevereiro", "passo": "Passo 2", "tema": "Passamos a acreditar que um Poder Superior poderia nos trazer de volta à sanidade", "devocional": "Depois de admitir a impotência, vem a pergunta natural: e agora, para onde eu vou? O Segundo Passo não exige uma definição religiosa nem respostas prontas — pede apenas disposição para acreditar que existe algo maior do que a nossa própria força de vontade, capaz de nos ajudar a pensar e viver de um jeito mais são. A insanidade era repetir o mesmo padrão esperando um resultado diferente. A esperança começa a voltar quando paramos de tentar vencer sozinhos e permitimos que outras pessoas, uma comunidade e algo maior caminhem ao nosso lado. Não é preciso ter fé em tudo de uma vez — só o suficiente para dar o próximo passo.", "phrases": ["A esperança que eu tinha perdido está voltando, um dia de cada vez.", "Não preciso entender tudo sobre um Poder Superior. Preciso apenas abrir espaço para acreditar em algo maior que minha compulsão.", "Recuperar a sanidade não é um evento — é uma prática diária.", "Hoje escolho acreditar que a mudança é possível, mesmo sem provas ainda.", "A fé não exige certeza. Exige apenas disposição para tentar mais um dia.", "Encontrar pessoas que entendem minha história me devolveu algo que eu achava perdido: pertencimento.", "Não estou mais sozinho lutando contra algo maior do que eu.", "A esperança cresce em silêncio, mesmo quando ainda não vejo os resultados.", "Acreditar em algo maior do que eu não me diminui — me alivia.", "Cada pessoa nesta sala que se recuperou é prova viva de que isso é possível para mim também.", "Não preciso ter todas as respostas hoje. Só preciso manter a mente aberta.", "Repetir o mesmo padrão esperando um resultado diferente já não faz mais sentido. Hoje escolho um caminho novo.", "Um Poder maior que eu não precisa ter nome — precisa apenas de espaço na minha vida.", "A esperança de hoje é mais forte do que o desespero de ontem.", "Não confio mais só na minha própria força. E isso, paradoxalmente, me fortalece.", "Cada história de recuperação que escuto planta uma semente de esperança na minha.", "Estou aprendendo a acreditar antes de ver — e é isso que chamam de fé.", "Recuperar o modo normal de pensar começa com pequenas escolhas normais, repetidas todos os dias.", "Não sou o único capaz de me ajudar, e isso não é fraqueza — é alívio.", "A esperança não apaga o passado, mas abre espaço para um futuro diferente dele.", "Quando duvido de mim mesmo, posso emprestar a fé de quem já percorreu esse caminho.", "Cada reunião que participo é um lembrete de que a recuperação é real, não apenas possível.", "Acreditar que posso mudar é o primeiro passo para realmente mudar.", "Hoje escolho manter a mente aberta, mesmo diante do que ainda não entendo.", "A sanidade que perdi no jogo está sendo devolvida, aos poucos, pela prática da recuperação.", "Não é preciso ter fé em tudo — só o suficiente para dar o próximo passo.", "Minha esperança de hoje é maior do que meu medo de ontem.", "Acredito que posso ser trazido de volta a um modo de viver mais saudável — e cada dia limpo é prova disso."]}, {"name": "Março", "passo": "Passo 3", "tema": "Decidimos entregar nossa vontade e nossas vidas aos cuidados de um Poder Superior", "devocional": "O Terceiro Passo é, antes de tudo, uma decisão — não um sentimento que precisa chegar primeiro. É comum travar aqui pensando 'não tenho certeza do que acredito', mas a Irmandade é uma comunidade espiritual, não religiosa: cada um segue com o entendimento que tem, e isso já é suficiente para começar. Entregar a vontade não é desistir de agir — é parar de exigir que a vida siga só pelas nossas próprias forças. Quando fechamos a porta para os horrores do passado, abrimos espaço para uma vida nova, mesmo sem saber exatamente como ela vai se desenhar. A prática deste mês é caminhar lado a lado com algo maior, um dia de cada vez.", "phrases": ["Hoje eu decido entregar minha vontade aos cuidados de algo maior do que minha própria teimosia.", "Não preciso carregar tudo sozinho. Essa é a decisão mais leve que já tomei.", "Entregar o controle não é desistir — é parar de lutar contra a correnteza sozinho.", "Espiritualidade não é religião. É a conexão que me tira da solidão da compulsão.", "Cada manhã, decido de novo confiar no processo, mesmo sem ver o caminho inteiro.", "A decisão de hoje não precisa ser perfeita. Precisa apenas ser sincera.", "Deixar de controlar tudo foi assustador — e depois, foi um alívio.", "Confiar em algo maior do que eu não me torna menor. Me torna parte de algo.", "Hoje escolho seguir em frente com a mente aberta, mesmo sem todas as certezas.", "A vontade que antes servia à compulsão, hoje aprendo a colocar a serviço da minha recuperação.", "Entregar não é fraqueza. É a coragem de admitir que sozinho eu não consegui.", "Cada dia que confio no processo é um dia que não preciso controlar tudo sozinho.", "Minha vida muda quando paro de exigir que ela siga só a minha vontade.", "A porta para o passado se fecha. A porta para uma vida nova se abre.", "Não escolho a fé porque tenho certeza — escolho porque a incerteza sozinha já não serve mais.", "Hoje decido caminhar lado a lado com algo maior, em vez de sozinho contra tudo.", "A entrega diária é pequena, mas seus efeitos se acumulam com o tempo.", "Aprendi que abrir mão do controle total é o que abriu espaço para a recuperação real.", "Cada escolha de confiar, mesmo pequena, reconstrói a fé que a compulsão havia abalado.", "Não sei todas as respostas, mas hoje escolho seguir mesmo assim.", "A liberdade que eu buscava no jogo, encontro agora ao entregar o peso que carregava sozinho.", "Decido, hoje, deixar que minha vida seja guiada por algo maior do que meu medo.", "A entrega não acontece uma vez — se pratica todos os dias, em pequenas decisões.", "Confiar no processo não significa não fazer nada. Significa fazer a minha parte e soltar o resto.", "Hoje escolho a humildade de pedir ajuda em vez do orgulho de fingir que não preciso.", "Uma vida guiada por algo maior é mais leve do que uma vida controlada só pelo medo.", "A cada entrega sincera, uma parte do peso antigo vai embora.", "Não preciso ter todas as certezas espirituais — só a disposição de seguir em frente.", "Hoje escolho confiar no próximo passo, mesmo sem ver o caminho inteiro.", "Entregar minha vontade não apaga quem eu sou — revela quem eu posso me tornar.", "Um dia de cada vez, aprendo que não preciso carregar tudo sozinho."]}, {"name": "Abril", "passo": "Passo 4", "tema": "Fizemos um minucioso e destemido inventário moral e financeiro de nós mesmos", "devocional": "Fazer um inventário minucioso não é um exercício de autopunição — é acender a luz em cômodos que evitávamos entrar havia anos. Muitos de nós escondemos até de nós mesmos os padrões que nos levaram até aqui: raiva, ressentimento, medo, orgulho ferido. Olhar para essas partes com honestidade dói, mas é uma dor que liberta, diferente da dor de continuar fugindo. Este inventário não define quem somos — é um mapa que mostra por onde já passamos, para que não precisemos repetir o mesmo caminho. A coragem, aqui, não é não sentir medo; é olhar mesmo com medo.", "phrases": ["Olhar para dentro exige coragem, mas é o único caminho para conhecer quem realmente sou.", "Meu inventário não é uma lista de culpas — é um mapa para entender meus padrões.", "Cada verdade que reconheço sobre mim mesmo tira um pouco do peso que eu carregava escondido.", "Não tenho medo de olhar para minhas falhas. Tenho coragem de finalmente enxergá-las.", "Conhecer meus defeitos não me diminui — me dá o poder de trabalhá-los.", "A honestidade minuciosa comigo mesmo é um ato de amor-próprio, não de autopunição.", "Cada padrão que reconheço hoje é um padrão que não precisa mais me controlar amanhã.", "Fazer meu inventário é acender a luz em cômodos que eu evitava por muito tempo.", "Não sou definido pelos meus erros passados, mas preciso conhecê-los para não repeti-los.", "Hoje encaro minhas falhas sem julgamento excessivo, apenas com o desejo sincero de mudar.", "O medo e o ressentimento perdem força quando finalmente são nomeados.", "Meu passado tem lições, não sentenças. Hoje escolho aprender com ele.", "Cada anotação sincera no meu inventário é um passo a mais para fora da confusão mental.", "Não preciso ser perfeito para começar — só preciso ser honesto.", "Reconhecer meus defeitos de caráter é o primeiro passo para deixar de ser refém deles.", "Minha história tem partes difíceis, mas contá-las com honestidade já é cura.", "Autoconhecimento não é autopunição. É a base sobre a qual reconstruo minha vida.", "Cada medo que enfrento no papel perde um pouco do poder que tinha sobre mim.", "Hoje escolho a coragem de olhar de frente para o que sempre evitei.", "Meu inventário financeiro e moral não é para me condenar — é para me libertar.", "Nomear meus ressentimentos é o primeiro passo para soltá-los.", "Não existe recuperação sem autoconhecimento. E não existe autoconhecimento sem coragem.", "Cada dia dedicado a me conhecer melhor é um dia investido na minha própria liberdade.", "Sou mais do que a soma dos meus erros — mas preciso conhecê-los para crescer.", "A verdade sobre mim mesmo, por mais difícil, é sempre mais leve do que a mentira que eu carregava.", "Hoje escolho examinar minha vida com honestidade, não com vergonha.", "Meus defeitos de caráter não são minha identidade — são apenas pontos a trabalhar.", "Cada página do meu inventário é um passo para fora do esconderijo em que eu vivia.", "Não fujo mais de mim mesmo. Hoje escolho me conhecer, com paciência e verdade.", "O autoconhecimento de hoje é o alicerce da liberdade de amanhã."]}, {"name": "Maio", "passo": "Passo 5", "tema": "Admitimos a nós mesmos e a outro ser humano a natureza exata de nossas falhas", "devocional": "Existe uma diferença enorme entre saber algo sobre nós mesmos e dizer isso em voz alta para outra pessoa. O Quinto Passo pede exatamente essa segunda parte: compartilhar a natureza exata das nossas falhas com alguém de confiança. É natural temer o julgamento, mas o que a maioria de nós encontra do outro lado é alívio — o segredo que nos adoecia em silêncio começa a perder força assim que é dito. Não se trata de reviver a culpa, mas de parar de carregar sozinhos aquilo que nunca deveria ter sido carregado sozinho. Ser ouvido sem julgamento também nos ensina, aos poucos, a nos perdoar.", "phrases": ["Dividir minha verdade com outra pessoa tirou de mim um peso que eu carregava sozinho há anos.", "O alívio que sinto ao ser honesto supera qualquer vergonha que eu temia sentir.", "Compartilhar minhas falhas com alguém de confiança foi libertador, não humilhante.", "Não preciso mais esconder quem eu fui para ser aceito por quem eu sou hoje.", "Cada verdade dita em voz alta perde um pouco do poder que tinha sobre mim em silêncio.", "Ser vulnerável com outra pessoa foi um dos atos mais corajosos da minha recuperação.", "O segredo que eu guardava me adoecia. A verdade compartilhada começou a me curar.", "Não estou mais sozinho com meus erros — e isso muda tudo.", "Admitir minhas falhas a outra pessoa foi assustador, mas o alívio depois valeu cada palavra.", "Cada vez que sou honesto sobre meu passado, fico mais leve para viver o presente.", "A vergonha cresce no silêncio e diminui quando é finalmente dita em voz alta.", "Compartilhar minha história com alguém de confiança me lembrou que sou humano, não um monstro.", "Não preciso mais fingir força. Posso ser honesto sobre minhas fraquezas.", "Cada confissão sincera é um tijolo a menos no muro que me isolava dos outros.", "Ser ouvido sem julgamento me ensinou que eu também posso me perdoar.", "A conexão verdadeira nasce quando paro de esconder quem realmente sou.", "Dizer a verdade sobre mim mesmo é um presente que dou à minha própria recuperação.", "Cada vez que compartilho minha história, ajudo também quem está ouvindo.", "O peso que eu carregava sozinho ficou mais leve assim que dividi com alguém.", "Não há cura no segredo. Há cura na verdade compartilhada com quem se importa.", "Admitir minhas falhas não apaga meu valor — na verdade, revela minha coragem.", "Cada vez que sou sincero sobre meu passado, dou um passo maior rumo à liberdade.", "Falar a verdade em voz alta transforma o que antes só existia como vergonha silenciosa.", "Encontrar alguém que escute sem julgar é um dos maiores presentes da recuperação.", "Minha história, mesmo com partes difíceis, merece ser contada com honestidade.", "Compartilhar não é fraqueza — é a prova de que estou pronto para mudar de verdade.", "Cada palavra honesta dita a outra pessoa é um passo para fora do isolamento.", "Hoje escolho a vulnerabilidade sincera no lugar da máscara que usei por tanto tempo.", "O alívio de ser plenamente honesto vale mais do que o conforto passageiro da mentira.", "Compartilhar minha verdade com alguém de confiança foi o começo da minha própria aceitação.", "Cada vez que sou honesto sobre quem fui, fico mais livre para escolher quem quero ser."]}, {"name": "Junho", "passo": "Passo 6", "tema": "Ficamos inteiramente dispostos a ter esses defeitos de caráter removidos", "devocional": "Não é fácil fazer uma limpeza na própria casa, especialmente quando a sujeira se acumulou por tanto tempo. O Sexto Passo não pede que já tenhamos vencido nossos defeitos de caráter — pede apenas disposição para trabalhá-los, um de cada vez. Os defeitos e as emoções negativas são, na prática, perturbações da serenidade que buscamos. A ideia não é atacar tudo de uma vez, mas escolher o que conseguimos tratar agora, com paciência, sabendo que todo ser humano tem defeitos, e que ficar preso a eles é o que pode nos levar de volta ao jogo. Ir devagar não é fracasso, desde que continuemos indo.", "phrases": ["Não preciso mudar tudo de uma vez. Preciso apenas estar disposto a começar.", "A disposição para mudar já é, em si, uma forma de mudança.", "Meus defeitos de caráter não desaparecem da noite para o dia, e está tudo bem.", "Hoje escolho um defeito de cada vez, com paciência comigo mesmo.", "Estar disposto a mudar é diferente de já ter mudado — e ambos têm valor.", "Cada pequeno progresso na minha forma de agir é uma vitória que merece ser celebrada.", "Não sou o único ser humano com defeitos de caráter. Isso me conecta, não me isola.", "A serenidade que busco começa quando paro de deixar pequenas coisas me desestabilizarem.", "Ir devagar não é fracasso, desde que eu continue indo.", "Cada defeito que reconheço e trabalho é um pouco menos de peso na minha caminhada.", "Não preciso ser perfeito para merecer a recuperação. Preciso apenas estar disposto a crescer.", "A mudança verdadeira é um processo, não um evento único.", "Hoje escolho ficar disposto, mesmo quando a mudança parece difícil demais.", "Meus velhos padrões me protegiam de algo — hoje aprendo novas formas de me proteger.", "Cada dia de disposição sincera vale mais do que anos fingindo que já estava tudo resolvido.", "Não tenho pressa para ser uma pessoa diferente amanhã. Tenho paciência para me tornar, aos poucos.", "A disposição de hoje é a semente da mudança de amanhã.", "Cada defeito que decido trabalhar é um espaço a mais para a serenidade entrar.", "Não fico mais preso aos velhos hábitos só porque eram familiares.", "Estou disposto a deixar ir o que não me serve mais, mesmo quando é desconfortável.", "A verdadeira força está em admitir o que preciso mudar, não em fingir que já mudei.", "Cada escolha consciente hoje enfraquece um pouco mais os padrões antigos.", "Não busco perfeição — busco progresso, um defeito de cada vez.", "Estar disposto a mudar é abrir a porta; a mudança em si acontece devagar, com prática.", "Hoje escolho a paciência comigo mesmo no processo de me tornar quem quero ser.", "Cada dia que trabalho meus defeitos é um dia mais perto da serenidade que busco.", "Não preciso resolver todos os meus defeitos hoje — só preciso estar disposto a começar.", "A disposição sincera para mudar já muda, silenciosamente, o rumo da minha história.", "Meus velhos defeitos foram companheiros por muito tempo. Hoje escolho me despedir deles, aos poucos.", "Estou disposto a crescer, mesmo sabendo que o processo é lento e nem sempre confortável."]}, {"name": "Julho", "passo": "Passo 7", "tema": "Humildemente pedimos que fossem removidas as nossas imperfeições", "devocional": "Humildade, aqui, não tem nada a ver com se diminuir. É simplesmente se ver com honestidade — reconhecer que não conseguimos remover sozinhos os defeitos que identificamos, e que está tudo bem pedir ajuda para isso. Depois de tanto tempo escondendo fraquezas atrás de uma máscara de controle, admitir que ainda estamos em construção é, paradoxalmente, um dos atos mais fortes que existem. Não buscamos a perfeição este mês — buscamos honestidade sobre onde ainda precisamos crescer, e a disposição de continuar pedindo ajuda sempre que for preciso.", "phrases": ["Pedir ajuda não é fraqueza — é a forma mais honesta de força que existe.", "A humildade que hoje pratico é diferente da humilhação que o jogo me causava.", "Não preciso remover minhas imperfeições sozinho. Posso pedir ajuda para isso também.", "Cada pedido sincero de ajuda é um ato de coragem, não de derrota.", "A humildade me ensina que não preciso ter todas as respostas para seguir em frente.", "Hoje escolho pedir, em vez de insistir em resolver tudo sozinho.", "Minhas imperfeições não me definem — são apenas pontos que ainda estou aprendendo a trabalhar.", "A humildade verdadeira não me diminui. Me torna mais aberto para crescer.", "Cada vez que peço ajuda, um pouco do meu antigo orgulho vai embora.", "Não preciso ser autossuficiente o tempo todo. Recuperação também é aprender a receber.", "A humildade de hoje constrói a força que vou precisar amanhã.", "Aceito que ainda tenho imperfeições — e isso não me torna menos digno de recuperação.", "Cada pedido de ajuda sincero fortalece, não enfraquece, minha caminhada.", "Não busco ser perfeito. Busco ser honesto sobre onde ainda preciso crescer.", "A humildade me liberta do peso de precisar controlar tudo sozinho.", "Hoje escolho pedir ajuda para lidar com o que ainda não consigo sozinho.", "Minhas falhas de hoje não apagam meu progresso até aqui.", "A verdadeira força está em reconhecer os próprios limites, não em escondê-los.", "Cada dia que pratico humildade, fico mais aberto para a mudança real.", "Não tenho vergonha de pedir ajuda para remover o que ainda me atrapalha.", "A humildade não é se diminuir — é se ver com honestidade.", "Hoje aceito que ainda estou em construção, e está tudo bem.", "Cada imperfeição reconhecida é um espaço a menos para o orgulho antigo.", "Não preciso vencer sozinho o que nem sozinho consegui enfrentar antes.", "A humildade de pedir ajuda hoje é o que sustenta minha recuperação amanhã.", "Minhas imperfeições continuam sendo trabalhadas, um dia de cada vez, com paciência.", "Aceitar ajuda é um dos atos mais fortes que já pratiquei.", "Hoje escolho a humildade no lugar do orgulho que antes me isolava.", "Cada pedido sincero de ajuda é uma prova de que estou levando minha recuperação a sério.", "Não preciso ser perfeito para ser digno de uma vida melhor.", "A humildade que pratico hoje é o solo onde minha recuperação continua crescendo."]}, {"name": "Agosto", "passo": "Passo 8", "tema": "Fizemos uma lista de todas as pessoas a quem prejudicamos", "devocional": "Olhar para a lista de pessoas que machucamos não é reviver a culpa — é o começo da responsabilidade. A compulsão não destrói só contas bancárias; ela corrói relacionamentos, afasta famílias e rouba a confiança de quem estava por perto. Fazer essa lista com honestidade, sem fugir dos nomes mais difíceis, é o que nos permite finalmente parar de evitar as consequências dos nossos atos passados. Não precisamos ter certeza de como cada reparação vai acontecer — só precisamos estar dispostos a assumir nossa parte. Essa disposição, por si só, já começa a curar algumas das feridas que causamos.", "phrases": ["Reconhecer quem eu machuquei é um ato de responsabilidade, não de autopunição.", "Estou disposto a reparar o mal que causei, mesmo sabendo que leva tempo.", "Cada nome na minha lista representa uma relação que quero honrar com verdade.", "A disposição para reparar já começa a curar algumas das feridas que causei.", "Não posso mudar o passado, mas posso assumir responsabilidade por ele hoje.", "Cada pessoa que machuquei merece minha honestidade sobre o que aconteceu.", "Estou pronto para olhar de frente para o estrago que a compulsão causou ao meu redor.", "A responsabilidade que assumo hoje é const SERENITY_PRAYER = 'Deus, concedei-me a serenidade para aceitar as coisas que não posso modificar, coragem para modificar aquelas que posso, e sabedoria para perceber a diferença.';
const MEDITATIONS = [{"month": "Janeiro", "passo": "Passo 1", "tema": "Admitimos que éramos impotentes perante o jogo – que nossas vidas haviam se tornado ingovernáveis", "days": [{"titulo": "Admitir a impotência", "reflexao": "Por muito tempo, tentei provar a mim mesmo que ainda tinha controle sobre o jogo. Cada aposta era uma forma de mostrar que era eu quem decidia quando parar. Hoje, escolho parar de provar isso. Não preciso mais fingir força onde só havia exaustão. Admitir que sou impotente perante o jogo não é o fim da minha história — é o primeiro parágrafo de um capítulo novo. Já aceitei, de verdade, que preciso de ajuda?", "oracao": "Que eu tenha coragem de dizer a verdade sobre onde estou, sem me esconder atrás de desculpas ou minimizações. Que a admissão de hoje seja o começo de uma vida mais honesta.", "lembrete": "Admitir não é perder — é começar a vencer."}, {"titulo": "Vida ingovernável", "reflexao": "Ingovernável não significa que eu era uma pessoa má — significa que eu tentava controlar algo que já havia se tornado maior do que minha própria força. As contas atrasadas, as mentiras acumuladas, as noites em claro: tudo isso era prova de que eu não estava mais no comando, mesmo que eu insistisse em dizer que estava. Reconhecer o tamanho do problema não é dramatizar. É simplesmente ver com clareza o que já estava acontecendo há tempo.", "oracao": "Que eu enxergue minha vida como ela realmente está, sem exagerar nem diminuir. Que essa clareza, mesmo dolorosa, seja o solo onde começo a reconstruir.", "lembrete": "Ver com clareza é o primeiro passo para reorganizar."}, {"titulo": "Parar de negar", "reflexao": "A negação foi minha companheira mais fiel por muito tempo. Ela sempre tinha uma explicação pronta: 'não é tão grave assim', 'eu controlo quando quero', 'só dessa vez'. Hoje escolho não alimentar mais essas frases. A negação não me protegia — ela só adiava o momento em que eu precisaria, de qualquer forma, olhar para a verdade. Cada dia que escolho a honestidade é um dia a menos vivendo de ilusão.", "oracao": "Que eu tenha coragem de desmontar, uma por uma, as desculpas que usei por tanto tempo. Que a verdade, mesmo difícil, seja sempre a minha escolha.", "lembrete": "A negação atrasa a cura; a verdade a inicia."}, {"titulo": "O primeiro 'não' de hoje", "reflexao": "Não preciso vencer a doença inteira hoje. Preciso apenas dizer não uma vez — à próxima aposta, ao próximo impulso, ao próximo 'só mais uma vez'. Recuperação não é uma decisão tomada uma única vez e resolvida para sempre; é uma decisão pequena, repetida, todos os dias. Hoje, meu único compromisso é com as próximas 24 horas.", "oracao": "Que eu tenha força para o meu único compromisso de hoje: não jogar, só por hoje. Que eu não me sobrecarregue com o peso do amanhã.", "lembrete": "Só por hoje já é suficiente."}, {"titulo": "Aceitação, não resignação", "reflexao": "Existe uma diferença importante entre aceitar e desistir. Aceitar que sou impotente perante o jogo não significa que não há esperança — significa que parei de lutar sozinho, com as ferramentas erradas, contra algo maior do que eu. A resignação diz 'nada vai mudar'. A aceitação diz 'isso é real, e agora posso buscar ajuda de verdade'. Já entendi essa diferença na minha própria caminhada?", "oracao": "Que eu aceite a realidade sem me entregar ao desespero. Que a aceitação de hoje abra espaço para a ajuda que ainda não busquei.", "lembrete": "Aceitar não é desistir — é finalmente começar."}, {"titulo": "Vergonha e verdade", "reflexao": "A vergonha me fez esconder muita coisa por muito tempo. Eu tinha medo de que, se as pessoas soubessem a verdade, deixariam de me ver como antes. Mas o segredo guardado sempre pesou mais do que a verdade dita. Hoje, escolho acreditar que ser honesto sobre minha história vale mais do que manter uma imagem que já não correspondia à realidade.", "oracao": "Que eu solte, aos poucos, a vergonha que carreguei em silêncio. Que a verdade dita em voz alta pese menos do que o segredo guardado.", "lembrete": "O segredo pesa mais do que a verdade."}, {"titulo": "Medo de encarar a realidade", "reflexao": "Fugir da realidade era mais fácil do que encará-la — por um tempo. O jogo servia exatamente para isso: adiar o confronto com o que eu não queria ver. Hoje, escolho não fugir mais. Encarar a realidade não apaga o medo, mas o medo perde força quando deixo de evitá-lo e começo, aos poucos, a olhar de frente.", "oracao": "Que eu tenha coragem de olhar para o que sempre evitei. Que o medo de hoje seja menor do que a coragem que estou construindo.", "lembrete": "O que evito controla mais; o que encaro perde força."}, {"titulo": "Expectativas irrealistas", "reflexao": "Hoje, tentarei aceitar menos do que achava ser possível, ficando disposto não somente a aceitar, mas também a apreciar. Não vou esperar demasiado de alguém — muito menos de mim. A satisfação vem de aceitar graciosamente as coisas boas que recebo, e não de ficar frustrado com a vida porque ela não é perfeita. Já entendi a diferença entre me exigir demais e me tratar com justiça?", "oracao": "Que eu não tenha expectativas irrealistas, esperando demais de mim mesmo. Que eu olhe para meus objetivos com bom senso, sem transformá-los em armadilhas para a minha compulsão.", "lembrete": "O bom é bom o bastante."}, {"titulo": "Comparação", "reflexao": "É fácil olhar para outro membro do grupo e pensar 'ele está muito mais recuperado do que eu'. Mas cada recuperação tem seu próprio ritmo, sua própria história, seu próprio tempo. Comparar minha caminhada com a de outra pessoa só me afasta do que realmente importa: o meu próximo passo, hoje, no meu próprio tempo.", "oracao": "Que eu pare de medir minha recuperação pela régua de outra pessoa. Que eu confie no meu próprio ritmo, por mais lento que pareça.", "lembrete": "Minha recuperação tem o meu tempo, não o do outro."}, {"titulo": "Perfeccionismo e fracasso", "reflexao": "Muitas vezes, os objetivos que tracei para mim eram impossíveis, e isso se transformava em armadilha para a minha compulsão. Ficava no meio do caminho, confrontado pelo meu próprio fracasso, e aqueles sentimentos de derrota viravam desculpa para me entregar de novo. Hoje escolho metas realistas, sabendo que o progresso importa mais do que a perfeição.", "oracao": "Que eu evite o antigo padrão de metas impossíveis seguidas de sensação de fracasso. Que eu seja realista comigo mesmo, hoje e sempre.", "lembrete": "Progresso, não perfeição."}, {"titulo": "Isolamento", "reflexao": "O jogo cresceu na solidão que eu mesmo construí — afastando amigos, evitando conversas difíceis, preferindo estar sozinho a ser visto de verdade. Hoje, entendo que o isolamento nunca foi proteção, foi apenas mais um esconderijo. Cada conversa sincera que tenho é um tijolo a menos naquele muro que eu mesmo levantei.", "oracao": "Que eu escolha a conexão no lugar do isolamento, mesmo quando for desconfortável. Que eu permita que outras pessoas se aproximem de mim de novo.", "lembrete": "Isolamento nunca foi proteção — era esconderijo."}, {"titulo": "Pedir ajuda pela primeira vez", "reflexao": "Pedir ajuda pela primeira vez foi um dos momentos mais difíceis e mais importantes da minha caminhada. Não porque as palavras fossem complicadas, mas porque admitir que eu não conseguia sozinho ia contra tudo que eu tentava provar até então. Hoje sei que aquele pedido, por mais difícil que tenha sido, foi o que abriu a porta para tudo que veio depois.", "oracao": "Que eu lembre da coragem que tive ao pedir ajuda a primeira vez, e que eu continue pedindo sempre que precisar, sem vergonha.", "lembrete": "Pedir ajuda foi o começo, não o fim."}, {"titulo": "Honestidade com o espelho", "reflexao": "A pessoa mais difícil de enganar deveria ser eu mesmo, mas por muito tempo foi exatamente o contrário. Eu acreditava nas minhas próprias desculpas. Hoje, pratico olhar no espelho com honestidade — não para me punir, mas para não me perder de novo em histórias que eu mesmo inventava para justificar o que já sabia estar errado.", "oracao": "Que eu seja honesto comigo mesmo antes de precisar ser honesto com qualquer outra pessoa. Que eu não acredite mais nas minhas próprias desculpas.", "lembrete": "A honestidade começa no espelho."}, {"titulo": "O ciclo do 'só mais uma vez'", "reflexao": "'Só mais uma vez' foi a frase que mais me enganou. Ela prometia ser a última, mas nunca era. Hoje reconheço esse padrão sem julgamento — só com clareza. Cada vez que sinto essa frase se formando, escolho pausar, respirar, e lembrar que ela nunca cumpriu o que prometeu antes.", "oracao": "Que eu reconheça o padrão do 'só mais uma vez' antes que ele me domine de novo. Que eu tenha força para pausar exatamente nesse momento.", "lembrete": "'Só mais uma vez' nunca foi a última."}, {"titulo": "Dinheiro e controle", "reflexao": "O dinheiro ocupava um espaço enorme demais na minha cabeça — como conseguir mais, como recuperar o que tinha perdido, como esconder o que já havia gasto. Hoje entendo que o problema nunca foi só o dinheiro; era a ilusão de controle que ele representava. Aos poucos, aprendo a colocar o dinheiro de volta no seu devido lugar.", "oracao": "Que eu deixe de dar ao dinheiro o poder que ele não deveria ter sobre minha paz. Que eu aprenda, aos poucos, a colocá-lo em seu devido lugar.", "lembrete": "O dinheiro é ferramenta, não deveria ser dono."}, {"titulo": "As mentiras que eu contava", "reflexao": "Cada mentira que eu contava para esconder o jogo exigia outra mentira para sustentá-la. Era um edifício instável, construído sobre uma base que eu sabia que ia desmoronar cedo ou tarde. Hoje escolho a verdade justamente porque ela não precisa de manutenção constante — ela simplesmente é.", "oracao": "Que eu não precise mais construir histórias para esconder a realidade. Que a verdade, mesmo desconfortável, seja sempre mais leve do que a mentira.", "lembrete": "A verdade não precisa de manutenção."}, {"titulo": "O peso do segredo", "reflexao": "Guardar segredo sobre o tamanho do problema foi um dos pesos mais silenciosos que carreguei. Ele não aparecia em nenhuma conta, mas estava presente em cada noite mal dormida, em cada desculpa nova. Compartilhar, mesmo que aos poucos, começou a aliviar um peso que eu nem sabia nomear direito.", "oracao": "Que eu continue compartilhando, aos poucos, o que ainda guardo em silêncio. Que cada palavra dita tire um pouco do peso que carrego sozinho.", "lembrete": "Compartilhado, o peso divide; guardado, ele cresce."}, {"titulo": "Aceitar o tamanho do problema", "reflexao": "Minimizar o problema foi uma estratégia que usei por muito tempo: 'não é tão grave', 'outros estão piores'. Hoje escolho ver o tamanho real do que aconteceu, sem exagerar e sem diminuir. Só vendo com clareza consigo medir corretamente o esforço que a recuperação vai exigir de mim.", "oracao": "Que eu tenha coragem de ver o tamanho real do que aconteceu, nem maior nem menor do que realmente foi.", "lembrete": "Só o que vejo com clareza, consigo tratar direito."}, {"titulo": "Deixar de minimizar", "reflexao": "Cada vez que eu dizia 'não foi tão ruim assim', eu adiava um pouco mais a hora de agir. Minimizar era outra forma de negar, só que mais sutil. Hoje pratico chamar as coisas pelo nome certo: perda foi perda, mentira foi mentira, dano foi dano. Só assim consigo, de fato, começar a reparar.", "oracao": "Que eu chame as coisas pelo nome certo, sem suavizar o que realmente aconteceu. Que essa honestidade seja o início da reparação.", "lembrete": "Chamar pelo nome certo é o começo de reparar."}, {"titulo": "O fundo do poço como início", "reflexao": "Para muitos de nós, foi só no momento mais difícil que finalmente aceitamos pedir ajuda. Isso não é motivo de vergonha — é apenas o caminho que precisamos percorrer até enxergar com clareza. O fundo do poço não define quem sou; define apenas o ponto de onde comecei a subir.", "oracao": "Que eu enxergue meu momento mais difícil não como fracasso definitivo, mas como o ponto de partida da minha recuperação.", "lembrete": "O fundo do poço é onde a subida começa."}, {"titulo": "Culpa versus responsabilidade", "reflexao": "Culpa me mantinha paralisado, remoendo o passado sem conseguir agir. Responsabilidade é diferente: ela olha para o que aconteceu e pergunta 'o que eu posso fazer agora?'. Hoje escolho trocar a culpa paralisante pela responsabilidade que me move para frente.", "oracao": "Que eu troque a culpa que me paralisa pela responsabilidade que me faz seguir em frente.", "lembrete": "Culpa paralisa; responsabilidade movimenta."}, {"titulo": "Medo do julgamento alheio", "reflexao": "Por muito tempo, o medo de ser julgado foi mais forte do que a vontade de pedir ajuda. Hoje entendo que quem realmente se importa comigo não vai me julgar pela doença — vai reconhecer a coragem de enfrentá-la. O julgamento que eu mais temia, na maioria das vezes, era o meu próprio.", "oracao": "Que eu não deixe o medo do julgamento alheio me impedir de buscar a ajuda que preciso. Que eu seja mais gentil com o meu próprio julgamento sobre mim mesmo.", "lembrete": "O julgamento que mais temo costuma ser o meu."}, {"titulo": "A ilusão do controle", "reflexao": "Achar que eu controlava o jogo foi a ilusão mais cara que já tive. Cada vitória alimentava essa crença; cada derrota era vista como azar temporário, nunca como sinal de que algo estava errado. Hoje reconheço que abrir mão dessa ilusão foi o que finalmente me permitiu buscar ajuda de verdade.", "oracao": "Que eu não caia de novo na ilusão de que controlo algo que já provou, tantas vezes, que eu não controlo.", "lembrete": "Abrir mão da ilusão é o início do controle real."}, {"titulo": "Vulnerabilidade como força", "reflexao": "Por muito tempo pensei que mostrar fraqueza era perigoso. Hoje entendo o contrário: foi exatamente quando permiti ser visto em minha vulnerabilidade que encontrei pessoas dispostas a caminhar comigo. Vulnerabilidade não me expõe a perigo — me conecta com quem pode realmente ajudar.", "oracao": "Que eu permita ser visto como realmente sou, sem a máscara de força que usei por tanto tempo.", "lembrete": "Vulnerabilidade conecta; a máscara isola."}, {"titulo": "Aceitar ajuda de estranhos", "reflexao": "Na minha primeira reunião, eu não conhecia ninguém, e ainda assim aquelas pessoas se importaram comigo. Aceitar ajuda de quem eu mal conhecia foi estranho no início, mas foi também uma das experiências mais humanas que já vivi. A recuperação, muitas vezes, começa com a bondade de desconhecidos.", "oracao": "Que eu continue aberto a receber ajuda, mesmo de quem ainda não conheço bem. Que eu retribua essa bondade quando for a minha vez.", "lembrete": "A recuperação começa, muitas vezes, com estranhos generosos."}, {"titulo": "O primeiro dia sem jogar", "reflexao": "Lembro do meu primeiro dia sem jogar — não porque foi fácil, mas porque foi o começo de tudo. Cada dia sem jogar que vivo agora é construído sobre aquele primeiro dia difícil. Hoje escolho honrar aquele começo continuando a caminhada, um dia de cada vez.", "oracao": "Que eu honre o esforço do meu primeiro dia sem jogar continuando essa caminhada hoje, e amanhã, e depois de amanhã.", "lembrete": "Cada dia limpo se apoia no anterior."}, {"titulo": "Recair na negação", "reflexao": "Às vezes, mesmo depois de tanto avanço, percebo a negação tentando voltar, disfarçada de 'eu já aprendi a lição, não preciso mais ter tanto cuidado'. Reconhecer essa voz antiga, sem me deixar enganar por ela de novo, é parte contínua da recuperação.", "oracao": "Que eu reconheça a voz antiga da negação quando ela tentar voltar, e que eu não me deixe enganar por ela de novo.", "lembrete": "A negação pode voltar disfarçada; a atenção continua."}, {"titulo": "Humildade diante da doença", "reflexao": "Reconhecer que tenho uma doença, e não apenas um mau hábito, mudou a forma como encaro minha recuperação. Não é sobre força de vontade sozinha — é sobre tratamento contínuo, apoio e humildade diante de algo maior do que minha própria determinação.", "oracao": "Que eu trate minha recuperação com a seriedade que uma doença exige, sem tentar resolver tudo sozinho pela força de vontade.", "lembrete": "Doença se trata com cuidado contínuo, não só vontade."}, {"titulo": "Gratidão pela clareza", "reflexao": "Por mais difícil que tenha sido chegar até aqui, hoje sinto gratidão pela clareza que ganhei. Ver a realidade, mesmo dolorosa, é infinitamente melhor do que viver na névoa da negação. A clareza de hoje é o que me permite escolher diferente amanhã.", "oracao": "Que eu seja grato pela clareza que ganhei, mesmo que o caminho até ela tenha sido difícil.", "lembrete": "Clareza dói menos do que a névoa, no fim das contas."}, {"titulo": "Olhar para trás sem se punir", "reflexao": "Posso olhar para meu passado sem precisar me punir por ele. Aconteceu, foi real, e trouxe consequências — mas olhar para trás com honestidade é diferente de me flagelar por decisões já tomadas. O passado ensina; não precisa ser usado como arma contra mim mesmo.", "oracao": "Que eu olhe para meu passado com honestidade, mas sem crueldade. Que as lições fiquem, e a punição excessiva vá embora.", "lembrete": "Olhar para trás é aprender, não se punir."}, {"titulo": "Fechando o mês: um novo modo de viver", "reflexao": "Terminando este primeiro mês de reflexão, reconheço que admitir a impotência não foi o fim de nada — foi o início de um novo modo de viver, mais honesto, mais humano, mais real. Sigo em frente, sabendo que o próximo mês trará novos aprendizados, sempre um dia de cada vez.", "oracao": "Que eu carregue comigo, para os próximos meses, a honestidade que comecei a praticar agora. Que cada mês que vier seja construído sobre essa base.", "lembrete": "Um novo modo de viver começa com um passo honesto."}]}, {"month": "Fevereiro", "passo": "Passo 2", "tema": "Passamos a acreditar que um Poder Superior a nós mesmos poderia trazer-nos de volta a um modo normal de pensar e viver", "days": [{"titulo": "A esperança que retorna", "reflexao": "Depois de admitir a impotência, veio uma pergunta natural: e agora? A esperança não retornou de uma vez — ela voltou aos poucos, em pequenos sinais: uma noite de sono melhor, uma conversa sincera, um dia sem jogar. Hoje reconheço que não preciso sentir esperança em tamanho grande para que ela conte. Pequenos sinais também são esperança de verdade.", "oracao": "Que eu reconheça os pequenos sinais de esperança que aparecem no meu dia, mesmo quando ainda são frágeis.", "lembrete": "A esperança volta aos poucos, não de uma vez."}, {"titulo": "O que é um Poder Superior", "reflexao": "Não preciso ter uma definição religiosa fechada para começar este passo. Jogadores Anônimos é uma Irmandade espiritual, não religiosa — cada um segue com o entendimento que tem. Um Poder Superior pode ser o grupo, pode ser a natureza, pode ser algo que ainda não sei nomear. O que importa é abrir espaço para acreditar em algo maior do que minha própria força de vontade.", "oracao": "Que eu abra espaço, com a minha própria compreensão, para algo maior do que eu mesmo. Que eu não trave este passo esperando uma certeza que talvez nunca venha de uma vez.", "lembrete": "Não preciso ter certeza — só espaço para acreditar."}, {"titulo": "Sanidade recuperada aos poucos", "reflexao": "Sanidade, aqui, não significa que eu estava 'louco' — significa recuperar um modo mais saudável de pensar e viver, depois de anos vivendo em função da próxima aposta. Cada decisão consciente que tomo hoje, por menor que seja, é um tijolo nessa reconstrução. A sanidade não volta de repente; ela se constrói decisão após decisão.", "oracao": "Que cada escolha consciente de hoje contribua para reconstruir um modo mais são de viver.", "lembrete": "Sanidade se reconstrói decisão por decisão."}, {"titulo": "Insanidade: repetir o mesmo padrão", "reflexao": "Fazer a mesma coisa esperando um resultado diferente foi, por muito tempo, minha rotina sem que eu percebesse. Cada aposta prometia ser diferente da anterior, mas seguia o mesmo padrão de sempre. Reconhecer esse ciclo, sem me culpar por ele, é o que me permite finalmente escolher um caminho novo.", "oracao": "Que eu reconheça quando estou repetindo padrões antigos esperando resultados diferentes, e que eu tenha coragem de escolher um caminho novo.", "lembrete": "Resultado novo pede caminho novo."}, {"titulo": "Abrir a mente", "reflexao": "No início, resisti à ideia de um Poder Superior porque parecia contradizer o que eu achava que acreditava. Mas manter a mente aberta não exige abandonar minhas convicções — exige apenas estar disposto a considerar que existe algo além do que eu já sei. Essa abertura, sozinha, já é um tipo de progresso.", "oracao": "Que eu mantenha a mente aberta mesmo diante do que ainda não compreendo completamente.", "lembrete": "Mente aberta não exige certeza — exige disposição."}, {"titulo": "Fé sem certeza", "reflexao": "Fé não é o mesmo que certeza absoluta. É possível ter fé e ainda assim carregar dúvidas — os dois podem coexistir. Hoje escolho seguir em frente com a fé que tenho hoje, mesmo que ela ainda seja pequena e cheia de perguntas sem resposta.", "oracao": "Que eu siga em frente com a fé que tenho hoje, mesmo que ainda seja pequena e incompleta.", "lembrete": "Fé pequena ainda é fé real."}, {"titulo": "Pertencimento em grupo", "reflexao": "Sentar em uma sala com pessoas que entendiam exatamente o que eu vivia me devolveu algo que eu já tinha dado como perdido: pertencimento. Não precisei explicar tudo — eles já sabiam. Esse tipo de compreensão silenciosa foi um dos primeiros sinais de que eu não estava sozinho.", "oracao": "Que eu valorize os espaços onde encontro pertencimento verdadeiro, sem precisar explicar tudo sobre minha história.", "lembrete": "Pertencer é ser entendido sem precisar explicar tudo."}, {"titulo": "Não estou mais sozinho", "reflexao": "Por muito tempo, lutei contra a compulsão como se fosse um problema só meu, que eu devia resolver sozinho, em silêncio. Hoje sei que essa solidão nunca foi necessária. Existem pessoas dispostas a caminhar ao meu lado — e permitir isso não me torna menos capaz, me torna mais humano.", "oracao": "Que eu permita companhia nesta caminhada, em vez de insistir em atravessá-la sozinho.", "lembrete": "Caminhar acompanhado não é fraqueza."}, {"titulo": "Acreditar antes de ver", "reflexao": "Estou aprendendo que às vezes é preciso acreditar antes de ver os resultados — é isso que chamam de fé. Não espero provas concretas de que tudo vai dar certo antes de agir; ajo com a esperança de que o esforço de hoje vale a pena, mesmo sem garantias.", "oracao": "Que eu tenha coragem de agir com fé, mesmo antes de ver os resultados que espero.", "lembrete": "Às vezes é preciso acreditar antes de ver."}, {"titulo": "Emprestar a fé de quem já percorreu", "reflexao": "Quando minha própria fé vacila, posso emprestar um pouco da fé de quem já percorreu esse caminho antes de mim. Ouvir a história de alguém que estava pior e hoje está bem me lembra que a recuperação não é teoria — é possível, porque já aconteceu com outras pessoas de carne e osso.", "oracao": "Que eu me apoie na experiência de quem já percorreu esse caminho, quando minha própria fé estiver fraca.", "lembrete": "Quando minha fé vacila, posso emprestar a de outro."}, {"titulo": "Ceticismo inicial", "reflexao": "É normal desconfiar no início — de um Poder Superior, do grupo, até de mim mesmo achando que dessa vez seria diferente. O ceticismo não é um obstáculo à recuperação; é só o ponto de partida de muita gente que, mesmo desconfiada, decidiu continuar experimentando.", "oracao": "Que meu ceticismo não me impeça de continuar tentando, mesmo sem todas as respostas ainda.", "lembrete": "Desconfiar no início não impede de continuar tentando."}, {"titulo": "O poder da comunidade", "reflexao": "Antes de encontrar qualquer definição espiritual, encontrei uma comunidade. Pessoas que se importavam, que ligavam, que perguntavam como eu estava. Para muitos de nós, o primeiro contato real com um poder maior do que nós mesmos aconteceu através dessa rede de cuidado humano.", "oracao": "Que eu reconheça, na comunidade que me cerca, um dos primeiros sinais de algo maior do que eu mesmo.", "lembrete": "A comunidade pode ser onde a fé começa a fazer sentido."}, {"titulo": "Esperança versus otimismo ingênuo", "reflexao": "Esperança não significa fingir que tudo está bem quando não está. É possível ter esperança e, ao mesmo tempo, reconhecer as dificuldades reais do caminho. A esperança madura caminha ao lado da realidade, não no lugar dela.", "oracao": "Que minha esperança seja realista, capaz de conviver com as dificuldades sem se desfazer diante delas.", "lembrete": "Esperança real convive com a dificuldade, não a ignora."}, {"titulo": "Pequenos sinais de mudança", "reflexao": "Uma conta paga em dia. Uma noite sem pesadelos. Uma conversa sem mentira. Nenhum desses sinais parece grandioso sozinho, mas juntos eles mostram que algo está, de fato, mudando. Aprendo a notar essas pequenas evidências em vez de esperar só por uma grande virada.", "oracao": "Que eu note os pequenos sinais de mudança no meu dia a dia, em vez de esperar apenas por grandes transformações.", "lembrete": "Mudança grande é feita de sinais pequenos."}, {"titulo": "Confiar em algo maior", "reflexao": "Confiar em algo maior do que eu não me torna menor — me alivia. Deixei de carregar sozinho o peso de resolver tudo, e essa partilha, mesmo abstrata no início, trouxe um respiro que eu não sentia havia muito tempo.", "oracao": "Que eu continue aprendendo a confiar em algo maior do que a minha própria força de vontade.", "lembrete": "Confiar em algo maior é alívio, não fraqueza."}, {"titulo": "Deixar de tentar salvar a si mesmo sozinho", "reflexao": "Passei anos tentando ser meu próprio resgate, sem sucesso. Hoje entendo que aceitar ajuda de fora — de pessoas, de uma comunidade, de algo maior — não é fracasso pessoal. É, na verdade, o que finalmente funcionou onde tanta força de vontade sozinha não deu conta.", "oracao": "Que eu aceite que não preciso ser meu próprio resgate sozinho.", "lembrete": "O que a força de vontade sozinha não resolveu, a ajuda pode resolver."}, {"titulo": "A insanidade da compulsão", "reflexao": "Olhando para trás, entendo melhor por que os textos de recuperação chamam a compulsão de uma forma de insanidade: eu sabia das consequências e, mesmo assim, repetia o mesmo comportamento. Reconhecer isso não é se diminuir — é entender exatamente o que estou tentando curar.", "oracao": "Que eu entenda com clareza a natureza da minha compulsão, sem me punir por ela, apenas para tratá-la melhor.", "lembrete": "Entender a doença ajuda a tratá-la."}, {"titulo": "Testemunhos de recuperação", "reflexao": "Cada pessoa na sala que já está recuperada há anos é prova viva de que isso é possível. Não preciso confiar apenas na teoria — posso confiar no que vejo, em pessoas reais que já percorreram esse caminho antes de mim e continuam bem.", "oracao": "Que eu me fortaleça com os testemunhos de quem já percorreu esse caminho antes de mim.", "lembrete": "A recuperação alheia é prova de que a minha também é possível."}, {"titulo": "Fé como prática, não sentimento", "reflexao": "Fé nem sempre é um sentimento forte e constante. Às vezes é apenas uma prática: ir à reunião mesmo sem vontade, pedir ajuda mesmo com vergonha, continuar tentando mesmo sem sentir motivação. A fé praticada sustenta, mesmo quando o sentimento de fé está ausente.", "oracao": "Que eu pratique a fé mesmo nos dias em que não sinto nada parecido com ela.", "lembrete": "Fé é prática, não depende só do sentimento do dia."}, {"titulo": "Abandonar o ceticismo rígido", "reflexao": "Ser cético não é um problema — ser rígido demais para considerar qualquer possibilidade, sim. Hoje escolho manter meu senso crítico, mas sem fechar completamente a porta para experiências que ainda não compreendo totalmente.", "oracao": "Que eu mantenha meu senso crítico sem deixar que ele feche completamente a porta para o que ainda não entendo.", "lembrete": "Questionar é saudável; fechar a porta, não."}, {"titulo": "O que significa sanidade na recuperação", "reflexao": "Sanidade, neste contexto, significa parar de tomar decisões que sei, de antemão, que vão me prejudicar. É pensar antes de agir, é considerar consequências, é escolher o caminho mais devagar quando ele é o mais seguro. Um modo normal de pensar e viver, aos poucos, sendo reconstruído.", "oracao": "Que eu pratique, todos os dias, um pensamento mais consciente antes de agir.", "lembrete": "Sanidade é pensar antes de agir, todos os dias."}, {"titulo": "Espiritualidade sem dogma", "reflexao": "Não preciso seguir um dogma específico para viver este passo. A espiritualidade que encontro aqui é mais sobre conexão e humildade do que sobre regras rígidas. Cada pessoa segue com seu próprio entendimento, e isso é respeitado, não questionado.", "oracao": "Que minha espiritualidade seja um espaço de conexão, não de regras rígidas que me afastam dos outros.", "lembrete": "Espiritualidade aqui é conexão, não dogma."}, {"titulo": "O primeiro sinal de esperança", "reflexao": "Lembro do primeiro momento em que senti, mesmo que fraco, um fio de esperança. Não veio de uma grande revelação — veio de ouvir alguém contar uma história parecida com a minha e dizer que hoje estava bem. Às vezes a esperança começa assim, pequena e emprestada.", "oracao": "Que eu valorize o primeiro fio de esperança que sinto, mesmo quando ele ainda é frágil.", "lembrete": "A esperança pode começar pequena e emprestada."}, {"titulo": "Confiar no processo", "reflexao": "Não vejo o caminho inteiro da minha recuperação, e está tudo bem. Confio no processo mesmo sem enxergar todos os passos à frente — sabendo que cada reunião, cada conversa honesta, cada dia sem jogar, faz parte de algo maior que ainda estou construindo.", "oracao": "Que eu confie no processo, mesmo sem enxergar o caminho inteiro à minha frente.", "lembrete": "Não preciso ver o caminho inteiro para confiar nele."}, {"titulo": "A comunidade como Poder Superior inicial", "reflexao": "Para muitos de nós, a própria irmandade funciona como uma primeira experiência de algo maior do que nós mesmos — um grupo de pessoas comprometidas com o bem-estar umas das outras, sem interesse próprio. Essa força coletiva já é, por si só, um tipo de poder que nenhum de nós teria sozinho.", "oracao": "Que eu reconheça na força coletiva do grupo um reflexo daquilo que ainda estou aprendendo a chamar de Poder Superior.", "lembrete": "Juntos, somos mais fortes do que qualquer um sozinho."}, {"titulo": "Dúvida e fé coexistindo", "reflexao": "Não preciso resolver todas as minhas dúvidas antes de seguir em frente. Dúvida e fé podem, sim, existir ao mesmo tempo — e é exatamente assim, com as duas juntas, que sigo avançando, um dia de cada vez.", "oracao": "Que eu permita que dúvida e fé caminhem juntas, sem exigir que uma elimine completamente a outra.", "lembrete": "Dúvida e fé podem caminhar lado a lado."}, {"titulo": "Recuperando a capacidade de acreditar", "reflexao": "A compulsão havia me deixado cínico sobre quase tudo — sobre mim, sobre os outros, sobre a possibilidade de mudança. Recuperar a capacidade de acreditar em algo é, em si, uma forma de cura que acontece bem antes de qualquer resultado prático aparecer.", "oracao": "Que eu recupere, aos poucos, a capacidade de acreditar que existem coisas boas possíveis para mim.", "lembrete": "Recuperar a fé também é recuperar a si mesmo."}, {"titulo": "Fechando o mês: esperança prática", "reflexao": "Terminando este mês, entendo que a esperança que buscava não é um sentimento mágico que resolve tudo de uma vez — é uma prática diária, sustentada por pequenas escolhas, por uma comunidade que se importa, e pela disposição de acreditar mesmo sem certezas completas. Sigo em frente para o próximo passo com essa base.", "oracao": "Que eu carregue, para o próximo mês, a esperança prática que comecei a construir agora.", "lembrete": "A esperança que sustenta é a que se pratica todo dia."}]}, {"month": "Março", "passo": "Passo 3", "tema": "Tomamos a decisão de entregar nossa vontade e nossas vidas aos cuidados deste Poder de nosso entendimento", "days": [{"titulo": "Uma decisão, não um sentimento", "reflexao": "O Terceiro Passo não exige que eu sinta algo especial antes de agir — exige uma decisão. Posso decidir entregar minha vontade mesmo sem sentir confiança total no processo. A ação vem primeiro; o sentimento de confiança, muitas vezes, vem depois, construído pela prática repetida dessa decisão.", "oracao": "Que eu tenha coragem de decidir, mesmo sem sentir toda a confiança que gostaria de ter.", "lembrete": "A decisão vem primeiro; o sentimento, depois."}, {"titulo": "Espiritual, não religioso", "reflexao": "Por muito tempo, resisti a este passo achando que ele exigia uma fé religiosa específica. Hoje entendo que a Irmandade é espiritual, não religiosa — cada um segue com o entendimento que tem. Isso me deu liberdade para participar deste passo do meu próprio jeito, sem precisar encaixar em nenhum molde.", "oracao": "Que eu viva este passo com a liberdade de seguir meu próprio entendimento espiritual, sem me sentir pressionado a um molde que não é meu.", "lembrete": "Espiritual não é sinônimo de religioso."}, {"titulo": "Entregar não é desistir", "reflexao": "Entregar minha vontade não significa parar de agir — significa parar de insistir que só a minha força resolve tudo. Ainda faço minha parte todos os dias; só não exijo mais que essa parte seja suficiente sozinha.", "oracao": "Que eu continue fazendo minha parte, sem exigir que ela seja suficiente sozinha.", "lembrete": "Entregar é somar forças, não parar de agir."}, {"titulo": "O medo de soltar o controle", "reflexao": "Soltar o controle assustava porque, por muito tempo, controlar tudo parecia a única forma de me sentir seguro. Hoje reconheço que esse controle era, na maior parte do tempo, ilusório — e que soltar essa ilusão trouxe mais paz do que insegurança.", "oracao": "Que eu solte, aos poucos, o controle que sempre foi mais ilusão do que segurança real.", "lembrete": "O controle que eu tanto temia soltar já era ilusão."}, {"titulo": "Uma porta se fecha, outra se abre", "reflexao": "Quando decido deixar para trás os padrões antigos, sinto que uma porta se fecha atrás de mim. É desconfortável olhar para trás e ver essa porta fechando — mas é exatamente esse fechamento que abre espaço para a porta seguinte, a de uma vida diferente.", "oracao": "Que eu tenha paz ao ver as portas do passado se fechando, sabendo que outras se abrem à minha frente.", "lembrete": "Uma porta fechada é espaço para a próxima se abrir."}, {"titulo": "Confiar sem ver o caminho todo", "reflexao": "Não vejo o caminho inteiro da minha recuperação, e aprendo a seguir mesmo assim. Confiar no processo não significa ter certeza de cada próximo passo — significa dar o passo possível hoje, e confiar que o próximo aparecerá quando for a hora.", "oracao": "Que eu confie o suficiente para dar o passo de hoje, mesmo sem ver o caminho inteiro.", "lembrete": "Não preciso ver tudo para dar o próximo passo."}, {"titulo": "Vontade a serviço da recuperação", "reflexao": "A mesma força de vontade que antes servia para sustentar a compulsão, hoje aprendo a colocar a serviço da minha recuperação. Não é uma força nova — é a mesma energia, redirecionada para um propósito diferente.", "oracao": "Que minha força de vontade sirva, a partir de hoje, à minha recuperação e não mais à minha compulsão.", "lembrete": "A mesma força pode servir a um propósito novo."}, {"titulo": "Humildade na decisão", "reflexao": "Decidir entregar minha vontade exige um tipo de humildade que eu não praticava antes: admitir que não tenho todas as respostas, e que está tudo bem não ter. Essa humildade não me diminui — me deixa mais leve.", "oracao": "Que eu pratique a humildade de não precisar ter todas as respostas antes de seguir em frente.", "lembrete": "Não ter todas as respostas também é uma forma de liberdade."}, {"titulo": "Caminhar lado a lado", "reflexao": "Não estou entregando minha vida para deixar de agir — estou escolhendo caminhar lado a lado com algo maior, em vez de sozinho contra tudo. Essa companhia, mesmo abstrata, muda a forma como encaro os desafios do dia a dia.", "oracao": "Que eu sinta, mesmo nos dias difíceis, que não caminho mais sozinho.", "lembrete": "Caminhar lado a lado é diferente de caminhar sozinho."}, {"titulo": "A decisão renovada todos os dias", "reflexao": "Este passo não se resolve de uma vez para sempre — é uma decisão que renovo todas as manhãs. Alguns dias essa entrega é fácil; outros dias, preciso decidir de novo, com mais esforço. As duas formas contam como progresso.", "oracao": "Que eu renove, hoje, minha decisão de entregar minha vontade aos cuidados de algo maior.", "lembrete": "A entrega se renova a cada manhã."}, {"titulo": "Deixar de exigir certezas", "reflexao": "Passei muito tempo exigindo certezas antes de agir, e essa exigência, muitas vezes, só me paralisava. Hoje aprendo a agir com a certeza possível do momento, mesmo que ela seja parcial.", "oracao": "Que eu aja com a certeza possível de hoje, sem exigir garantias que talvez nunca cheguem.", "lembrete": "A certeza possível hoje já é suficiente para agir."}, {"titulo": "O peso que solto ao entregar", "reflexao": "Cada entrega sincera tira um pouco do peso que carregava sozinho. Não é um alívio instantâneo e completo — é um alívio que se acumula, entrega após entrega, dia após dia.", "oracao": "Que eu sinta, aos poucos, o peso diminuindo a cada entrega sincera que faço.", "lembrete": "O alívio se acumula, entrega após entrega."}, {"titulo": "Aceitar orientação", "reflexao": "Aceitar orientação — de um padrinho, de um terapeuta, de alguém com mais experiência — não fere meu orgulho como eu temia. Pelo contrário, encontrar quem já passou por isso e está disposto a orientar tem sido um dos maiores presentes desta caminhada.", "oracao": "Que eu esteja aberto a receber orientação de quem já percorreu esse caminho antes de mim.", "lembrete": "Aceitar orientação é sabedoria, não fraqueza."}, {"titulo": "O medo do desconhecido", "reflexao": "Não sei exatamente como vai ser minha vida daqui a um ano, e isso ainda me assusta um pouco. Mas prefiro esse medo do desconhecido à certeza de para onde a compulsão sempre me levava. O desconhecido, aqui, é também espaço para coisas boas que eu nem imagino ainda.", "oracao": "Que eu enfrente o medo do desconhecido lembrando que ele também guarda espaço para coisas boas.", "lembrete": "O desconhecido assusta, mas também guarda coisas boas."}, {"titulo": "Renunciar à necessidade de vencer sozinho", "reflexao": "Havia um orgulho silencioso em querer vencer tudo sozinho, sem ajuda de ninguém. Esse orgulho, na prática, só me manteve preso por mais tempo. Hoje entendo que vencer acompanhado não diminui a vitória — a torna mais real.", "oracao": "Que eu renuncie à necessidade de vencer sozinho, e aceite que vencer acompanhado também é vencer de verdade.", "lembrete": "Vencer acompanhado ainda é vencer."}, {"titulo": "Confiança que se constrói aos poucos", "reflexao": "Não confiei em algo maior do que eu de uma vez só — essa confiança foi se construindo aos poucos, a cada vez que segui em frente e as coisas, de alguma forma, se ajeitaram melhor do que eu esperava.", "oracao": "Que eu permita que minha confiança se construa aos poucos, sem pressa, na medida em que a vida me mostra sinais.", "lembrete": "Confiança se constrói com o tempo, não de uma vez."}, {"titulo": "Um novo modo de decidir", "reflexao": "Antes, minhas decisões eram guiadas pela urgência da próxima aposta. Hoje, pratico decidir com mais calma, considerando consequências, ouvindo outras vozes além da minha própria pressa. Esse é um novo modo de decidir que ainda estou aprendendo.", "oracao": "Que minhas decisões sejam guiadas pela calma, e não mais pela urgência antiga.", "lembrete": "Decidir com calma é diferente de decidir com urgência."}, {"titulo": "Aceitar não ter o controle total", "reflexao": "Aceitar que não tenho controle total sobre tudo que acontece foi, ironicamente, o que me trouxe mais paz. Enquanto eu insistia em controlar tudo, vivia ansioso. Ao entregar parte desse controle, sobrou espaço para viver com menos peso.", "oracao": "Que eu encontre paz em aceitar que não preciso controlar tudo o que acontece ao meu redor.", "lembrete": "Menos controle, às vezes, é mais paz."}, {"titulo": "A liberdade da entrega", "reflexao": "A liberdade que eu buscava no jogo, de forma distorcida, encontro agora de um jeito mais real: ao entregar o peso que carregava sozinho. É uma liberdade mais silenciosa, mas também mais duradoura.", "oracao": "Que eu reconheça, na entrega diária, uma forma real e duradoura de liberdade.", "lembrete": "A entrega traz uma liberdade mais duradoura que o controle."}, {"titulo": "Seguir mesmo sem todas as respostas", "reflexao": "Não sei todas as respostas sobre minha recuperação, sobre meu futuro, sobre como tudo vai se desenrolar. Hoje escolho seguir mesmo assim, confiando que as respostas vão aparecendo conforme forem necessárias.", "oracao": "Que eu siga em frente mesmo sem todas as respostas, confiando que elas aparecem no tempo certo.", "lembrete": "Nem todas as respostas precisam vir agora."}, {"titulo": "Uma vida guiada, não controlada pelo medo", "reflexao": "Antes, o medo guiava muitas das minhas decisões — medo de perder, medo de ser descoberto, medo de encarar a realidade. Hoje busco uma vida guiada por algo maior do que esse medo, mais leve e mais consciente.", "oracao": "Que minha vida seja guiada por algo maior do que o medo que antes controlava minhas escolhas.", "lembrete": "Uma vida guiada pelo medo é mais pesada que uma vida guiada por confiança."}, {"titulo": "A prática diária da entrega", "reflexao": "A entrega não acontece uma vez — se pratica todos os dias, em pequenas decisões: ped
